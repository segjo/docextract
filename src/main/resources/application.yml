spring:
  application:
    name: docextract
  mvc:
    static-path-pattern: /ui/**

server:
  servlet:
    context-path: /adeon-docextract

docextract:
  dvelop:
    jstore-uri: http://localhost:6380/store/httpgateway/appconfig
    # fallback used only when the jstore endpoint above is unreachable, e.g. https://dms.local
    system-base-uri: http://localhost:8081

---
spring:
  config:
    activate:
      on-profile: local
---
spring:
  config:
    activate:
      on-profile: ci
---
spring:
  config:
    activate:
      on-profile: cluster
