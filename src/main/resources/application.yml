spring:
  application:
    name: docextract
  mvc:
    static-path-pattern: /ui/**
  servlet:
    multipart:
      # Above Spring's 1 MiB default, so uploads reach the domain-level check in Limits (50 MiB, T-4)
      # instead of failing earlier with a bare 413 from the container.
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/docextract
    username: docextract
    password: docextract-local
  flyway:
    locations: classpath:db/migration
  ai:
    # ADR-009/-011: the generic OpenAI-compatible LLM/embedding adapters build their own
    # OpenAiChatModel/OpenAiEmbeddingModel directly from docextract.adapters.* below, not from
    # Spring Boot autoconfiguration. spring-ai-starter-model-openai still auto-configures
    # chat/embedding/audio/image/moderation OpenAI models by default though (each
    # matchIfMissing=true), and fails application startup without credentials configured
    # (BeanCreationException: "At least one credential source must be specified") — disable all
    # of them explicitly since none are used.
    model:
      chat: none
      embedding: none
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    # Agent path (FR-6): MCP server only runs with docextract.adapters.mcp.enabled=true. The
    # endpoint lies under /api/** so the d.velop authentication of SecurityConfig applies.
    mcp:
      server:
        enabled: ${docextract.adapters.mcp.enabled}
        name: docextract
        type: sync
        protocol: streamable
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /api/v1/mcp

server:
  servlet:
    context-path: /adeon-docextract

springdoc:
  paths-to-match: /api/v1/**, /health
  default-produces-media-type: application/json
  # Error responses are declared per operation; don't copy every @ExceptionHandler onto all of them.
  override-with-generic-response: false
  # Stable key order, so doc/api/openapi.yaml can be diffed against the generated spec.
  writer-with-order-by-keys: true
  # Disabled by default (prod/cluster must not expose the API schema or an unauthenticated UI,
  # see SecurityConfig's securityMatcher("/api/**") gotcha); re-enabled explicitly for local/ci.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    # Benign noise from PDFTextStripper on base-14 fonts (e.g. Times-Roman) with unmapped glyphs
    org.apache.pdfbox: error

docextract:
  tenant:
    # Single-tenant operation (app-secret empty): every request belongs to this tenant, x-dv-*
    # headers are ignored, the d.velop system base URI comes from docextract.dvelop.system-base-uri.
    default-id: default-tenant
    # d.velop cloud (multi-tenant): base64 app secret from the Cloudcenter. When set, the headers
    # x-dv-tenant-id, x-dv-baseuri and x-dv-sig-1 are mandatory on every /api request and the
    # signature (HMAC-SHA256 over baseuri + tenant id) is verified, otherwise 403. Env only.
    app-secret: ${DOCEXTRACT_TENANT_APP_SECRET:}
  agent:
    # d.velop user group id of the agents (MCP clients): members may only use the MCP endpoint, the
    # rest of /api is 403 for them. Required when MCP is enabled; 'none' = deliberately no group.
    group-id: ${DOCEXTRACT_AGENT_GROUP_ID:}
  audit:
    # Key of the audit actor pseudonym (HMAC-SHA256 over tenant + user id), at least 32 characters and
    # different from docextract.tenant.app-secret. Mandatory; only profile dev has a default key.
    actor-key: ${DOCEXTRACT_AUDIT_ACTOR_KEY:}
  dvelop:
    # Mock d.velop system by default (docker/dvelop-mock); override in a local, git-ignored .env
    # (see README) to point at a real d.velop system without touching this file.
    jstore-uri: ${DOCEXTRACT_DVELOP_JSTORE_URI:http://localhost:6380/store/httpgateway/appconfig}
    # fallback used only when the jstore endpoint above is unreachable, e.g. https://dms.local
    system-base-uri: ${DOCEXTRACT_DVELOP_SYSTEM_BASE_URI:http://localhost:8081}
  ingest:
    # T-4 DoS mitigation: hard cap on upload size (bytes), default 50 MiB
    max-file-size-bytes: 52428800
    # Blobstore quarantine window (ADR-008): raw/preview bytes are deleted at consent, rejection,
    # abort or when this TTL elapses, whichever comes first.
    blob-ttl: PT2H
    dms:
      # Fallback repository used when a caller doesn't offer a choice (e.g. the MCP gateway) or the
      # import mask's selected repository isn't staged for a process; the import mask itself lets
      # the user pick from GET /api/v1/ingest/import-info's repositories (GET /repo/repositories).
      repository-id: 7cd5d582-2b5d-5e56-9a15-619f94e6e3ed
  gotenberg:
    base-uri: http://localhost:3000
  docling:
    base-uri: http://localhost:5001
  ollama:
    # Local LLM mock endpoint by default (docker/llm-mock); override in a local, git-ignored .env
    # (see README) to point at a real Ollama instance, e.g. http://localhost:11435.
    base-uri: ${DOCEXTRACT_OLLAMA_BASE_URI:http://localhost:8082}
  adapters:
    # Chosen per port via @ConditionalOnProperty (ADR-011); a change needs config only, no code.
    preview: gotenberg
    # Read-only MCP tools for agents (FR-6, ARCHITECTURE § 6.3); off by default.
    mcp:
      enabled: false
    text-extraction: pdfbox # pdfbox (default) | docling not offered for FR-3 (ADR-012)
    document-content: fulltext # fulltext (PDFBox, default) | markdown (docling)
    llm:
      # Generic OpenAI-compatible adapter (ADR-011): local runtime (Ollama's /v1, llama.cpp, vLLM)
      # or hosted provider — only configuration differs. Local LLM mock endpoint by default
      # (docker/llm-mock); override base-url/api-key/model-id in a local, git-ignored .env (see
      # README) to point at a real provider, e.g. the Azure/Microsoft-Foundry deployment
      # (ADR-010, now folded into ADR-011) at https://adeon-drack-analyzer.openai.azure.com.
      base-url: ${DOCEXTRACT_ADAPTERS_LLM_BASE_URL:http://localhost:8082}
      api-key: ${DTRACK_ANALYZER_OPENAPI_TOKEN:}
      model-id: ${DOCEXTRACT_ADAPTERS_LLM_MODEL_ID:gpt-5.6-sol}
      # Optional Microsoft Foundry/Azure OpenAI api-version query parameter; blank for a plain
      # OpenAI-compatible endpoint.
      api-version: 2025-04-01-preview
      # Optional sampling params; blank means the provider's own default is used.
      temperature:
      top-p:
      # Additional attempts to re-request a response that fails the mandatory server-side
      # JSON-schema validation (T-1), on top of the first attempt; exhausted -> controlled failure
      # (ExtractAttributesService#generateValidated, NfA-3). 1 = one retry, two attempts total.
      max-retries: 1
    embedding:
      # Local Ollama's OpenAI-compatible embeddings endpoint by default (ADR-011); override in a
      # local, git-ignored .env (see README) to point at a real provider. Defaults to
      # docextract.ollama.base-uri so it tracks that override automatically unless set explicitly.
      base-url: ${DOCEXTRACT_ADAPTERS_EMBEDDING_BASE_URL:${docextract.ollama.base-uri}/v1}
      api-key: ${DOCEXTRACT_ADAPTERS_EMBEDDING_API_KEY:}
      model-id: ${DOCEXTRACT_ADAPTERS_EMBEDDING_MODEL_ID:qwen3-embedding:0.6b}
  content:
    # First-N-words plain text for FR-3 (ADR-012): no chunking, no structure/table
    # reconstruction. Must stay <= the embedding model's context window.
    max-words: 5000
    # Safety-net TTL for in-memory staged text/content (ADR-006): must never reach disk/DB.
    staging-ttl: PT30M
  retrieval:
    # Model id stamped onto stored vectors (§8.5), used to detect stale rows after a model switch
    # (ReindexService); kept in lockstep with docextract.adapters.embedding.model-id rather than
    # duplicated, since a mismatch would silently tag vectors with the wrong model. See
    # V3__embedding.sql for the vector column dimension this model must produce.
    embedding-model: ${docextract.adapters.embedding.model-id}
    # Quarantine window for PENDING embeddings (ADR-006/C-7), analogous to ingest's blob-ttl.
    pending-embedding-ttl: PT2H
    # Number of similar APPROVED documents FindSimilar returns (NfA-6: Precision@3 target).
    top-k: 5
    # Cosine-similarity floor (0..1) a hit must reach to be reported; lower-similarity hits are
    # dropped rather than shown to the user (NfA-6). 0.0 disables filtering.
    min-score: 0.9
    # Allow-list of DMS document type ids (comma-separated, e.g. DBEL,DBUE) offered as candidates;
    # empty = all repository document types.
    document-type-filter: DREC,DVER,DKOR
    # TTL for the similar-documents result handed to the validation UI, persisted in Postgres
    # (not per-instance memory) so any cluster node can serve it (ADR-004).
    result-ttl: PT2H
  valuelist:
    # Cap on values kept per property from the DMS valuelist webhook (T-4: a value list can hold
    # arbitrarily many entries). DmsPropertyDefinition.hasMoreValues signals when more existed.
    max-values: 50
  extraction:
    # TTL for the extraction result handed to the validation UI, persisted in Postgres (not
    # per-instance memory) so any cluster node can serve it (ADR-004).
    result-ttl: PT2H
    # Read-only LLM tool calls (lookup_value_list) per extraction (ADR-014).
    max-tool-calls: 10
  validation:
    # Interval of the promotion retry for FINALIZED_INDEX_PENDING (ADR-015).
    recovery-interval: PT5M
    # Promotion retries stop after this age of the first failure -> INDEX_FAILED (C-7 final failure).
    promotion-retry-limit: PT24H
    # Retry runs log an ERROR (alarm) for promotions still pending after this age.
    promotion-alert-after: PT1H
  cleanup:
    # Interval of the TTL cleanup job over all expires_at tables (shared.cleanup.TtlCleanupJob).
    interval: PT5M
  process:
    # Age of the newest step after which a process's process_step rows are deleted (existence source
    # of the process endpoints). Must be >= every result/blob/pending TTL and the promotion-retry-limit.
    step-retention: PT48H
---
spring:
  config:
    activate:
      on-profile: dev

docextract:
  adapters:
    mcp:
      enabled: true
  agent:
    group-id: none

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
---
spring:
  config:
    activate:
      on-profile: ci

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
---
spring:
  config:
    activate:
      on-profile: prod
