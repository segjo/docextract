openapi: 3.1.0
info:
  description: "Eigener REST-Vertrag von DocExtract. Fehler werden als application/problem+json\
    \ (RFC 9457, Schema `Problem`) beschrieben; siehe ARCHITECTURE.md § 8.1."
  title: DocExtract API
  version: v1
servers:
- description: Context-Path hinter dem Proxy
  url: /adeon-docextract
security:
- bearerAuth: []
tags:
- description: Attributvorschläge (FR-4)
  name: extraction
- description: "Upload, Vorschau, Importmaske (FR-1, ADR-008)"
  name: ingest
- description: Fortschritt je Prozess (ADR-004)
  name: process
- description: "Ähnliche Dokumente, Dokumentarten, Wertelisten (FR-3)"
  name: retrieval
- description: "Menschliche Freigabe/Ablehnung (FR-5, C-2, ADR-015)"
  name: validation
paths:
  /api/v1/ingest/documents:
    post:
      description: "Speichert die Bytes TTL-begrenzt im Blobstore und lädt das Original\
        \ write-only ins DMS (Chunk-Upload). Fortschritt über GET /api/v1/processes/{processId}/events."
      operationId: upload
      parameters:
      - in: query
        name: repositoryId
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestedDocument"
          description: Angenommen; Verarbeitung läuft asynchron (ADR-004).
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Upload abgewiesen (leere Datei, Grössen-Limit, nicht unterstü\
            tzter Medientyp; T-4) oder Parameter file/repositoryId fehlt (dann heute\
            \ ohne Body, ProblemDetail ab P7)."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Request grösser als spring.servlet.multipart.max-request-size\
            \ (50 MB). Heute ohne Body, ProblemDetail ab P7."
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DMS-Chunk-Upload fehlgeschlagen.
      summary: Dokument hochladen und Pipeline asynchron starten
      tags:
      - ingest
  /api/v1/ingest/documents/{blobId}/preview:
    get:
      description: "Native PDFs aus dem ORIGINAL-Blob, Nicht-PDFs aus dem gerenderten\
        \ PREVIEW-Blob (ADR-008). Unterstützt eine einzelne Byte-Range `bytes=start-end`."
      operationId: preview
      parameters:
      - in: path
        name: blobId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Einzelne Byte-Range, z. B. `bytes=0-1048575`."
        in: header
        name: Range
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: Ganzes Dokument.
        "206":
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: Teilinhalt gemäss Range-Header.
          headers:
            Content-Range:
              description: bytes start-end/total
              schema:
                type: string
              style: simple
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Blob unbekannt, abgelaufen oder gehört einem anderen Tenant\
            \ (NfA-4)."
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Rendern der Vorschau (Nicht-PDF) fehlgeschlagen.
      summary: PDF-Vorschau streamen (Range-fähig)
      tags:
      - ingest
  /api/v1/ingest/import-info:
    get:
      operationId: importInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportInfo"
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: "Importmaske: erlaubte Endungen, Upload-Limit, Repositories der Session"
      tags:
      - ingest
  /api/v1/object-definitions:
    get:
      operationId: objectDefinitions
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DmsDocumentMetadata"
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: Alle Dokumentarten und Eigenschaften des Repositories (live aus dem
        DMS)
      tags:
      - retrieval
  /api/v1/processes/{processId}/document-type-candidates:
    get:
      description: "Leere Liste, solange kein Ergebnis vorliegt oder der Prozess unbekannt\
        \ ist."
      operationId: documentTypeCandidates
      parameters:
      - in: path
        name: processId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DmsDocumentMetadata"
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: Dokumentart-Kandidaten des Prozesses
      tags:
      - retrieval
  /api/v1/processes/{processId}/events:
    get:
      description: "Event-Name = Schritt in Kleinbuchstaben (z. B. `extracted`), Daten\
        \ = ProcessEvent. Beim (Re-)Connect wird die Historie aus PROCESS_STEP nachgeliefert.\
        \ Payload PII-frei (nur processId/step/status)."
      operationId: processEvents
      parameters:
      - in: path
        name: processId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ProcessEvent"
          description: Event-Stream (offen bis Client trennt).
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: Fortschritt als Server-Sent Events
      tags:
      - process
  /api/v1/processes/{processId}/extraction-result:
    get:
      description: "Leeres Ergebnis, solange keines vorliegt oder der Prozess unbekannt\
        \ ist."
      operationId: extractionResult
      parameters:
      - in: path
        name: processId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: Vorgeschlagene Dokumentart und Attributwerte des Prozesses
      tags:
      - extraction
  /api/v1/processes/{processId}/extraction-result/retry:
    post:
      operationId: retryExtraction
      parameters:
      - in: path
        name: processId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: Extraktion mit vom Menschen gewählter Dokumentart wiederholen
      tags:
      - extraction
  /api/v1/processes/{processId}/similar-documents:
    get:
      description: "Leere Liste, solange kein Ergebnis vorliegt oder der Prozess unbekannt\
        \ ist."
      operationId: similarDocuments
      parameters:
      - in: path
        name: processId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetrievalResult"
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: "Ähnliche, freigegebene Dokumente des Prozesses"
      tags:
      - retrieval
  /api/v1/validation/confirm:
    post:
      description: |-
        Consent-Gate (C-2): einziger Pfad, der ins DMS schreibt. Saga gemäss ADR-015:
        Vorprüfung (Prozess und PENDING-Embedding gehören dem Tenant der Session, Quarantäne nicht
        abgelaufen) → Marker DMS_WRITE_STARTED → DMS-Write → FINALIZED_INDEX_PENDING →
        Promotion PENDING→APPROVED → COMPLETED → Blobs löschen.

        Idempotenz (Schlüssel: processId, siehe x-idempotency): Liegt für den Prozess bereits
        FINALIZED_INDEX_PENDING, COMPLETED oder INDEX_FAILED vor, erfolgt kein zweiter DMS-Write;
        die Antwort ist 200 mit den gespeicherten DMS-IDs (writtenBack = true) und dem aktuellen
        indexStatus. Bei FINALIZED_INDEX_PENDING wird nur die idempotente Promotion wiederholt.
        Attribute einer Wiederholung werden nicht ausgewertet.

        200 auch bei fehlgeschlagener Promotion: das DMS ist final, indexStatus =
        FINALIZED_INDEX_PENDING (Recovery-Job promotet nach).
      operationId: confirm
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationResult"
          description: DMS-Write erfolgt (auch bei Wiederholung).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Prozess unbekannt oder gehört einem anderen Tenant (NfA-4).
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Früherer DMS-Write mit unbekanntem Ausgang, DMS weist erneuten\
            \ Write ab: Dokument möglicherweise bereits im DMS gespeichert (ADR-015)."
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Quarantäne-Embedding abgelaufen; Dokument neu hochladen.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DMS lehnt die Attribute ab; Validierung mit korrigierten Werten
            wiederholen.
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "DMS nicht erreichbar oder Serverfehler; Ausgang unbekannt,\
            \ Marker bleibt (ADR-015)."
      summary: "Freigabe: Attribute ins DMS schreiben und Embedding promoten"
      tags:
      - validation
      x-data-classification:
        logging-audit: "Attributwerte nie loggen oder auditieren; Audit nur Ereignis,\
          \ Hashes und Referenzen, ohne Roh-PII (C-4)."
        request: "personal-data: attributes enthält vom Menschen bestätigte Attributwerte,\
          \ potenziell Personendaten."
        response: "internal: nur IDs und Status, keine Attributwerte."
      x-idempotency:
        evidence: "ValidationControllerIdempotencyTest, ConfirmAndWriteBackServiceTest"
        key: processId
        other-tenant: "404, ohne DMS-Write und ohne Existenzhinweis (NfA-4)."
        repeat-after-dms-write: "FINALIZED_INDEX_PENDING | COMPLETED | INDEX_FAILED:\
          \ kein zweiter DMS-Write; 200 mit gespeichertem repositoryId/documentId,\
          \ writtenBack = true, aktuellem indexStatus; bei FINALIZED_INDEX_PENDING\
          \ nur Promotion-Retry."
        repeat-with-unknown-outcome: "DMS_WRITE_STARTED (Ausgang des früheren Writes\
          \ unbekannt): DMS-Write wird erneut versucht; lehnt das DMS ab, 409 (Dokument\
          \ möglicherweise bereits gespeichert), kein Duplikat."
        request-body-on-repeat: Bei FINALIZED_INDEX_PENDING/COMPLETED/INDEX_FAILED
          wird der Request-Body nicht ausgewertet; Antwort 200 mit dem gespeicherten
          Ergebnis.
      x-slo:
        availability:
          target: 99.5%
          window: 30d
          definition: Anteil Antworten ohne 5xx; 4xx zählen nicht
        latency:
          percentile: p95
          target: 2s
          window: 30d
          measuredAt: "Backend, inkl. DMS-Write + Promotion"
        measurement: strukturiertes Logging (§ 8.3); Metriken ab Block 5.3
  /api/v1/validation/reject:
    post:
      description: Nur vor dem DMS-Write möglich (ADR-015).
      operationId: reject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
        required: true
      responses:
        "204":
          description: "Abgelehnt, Quarantänedaten gelöscht."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Prozess unbekannt oder gehört einem anderen Tenant (NfA-4).
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Prozess bereits im DMS finalisiert.
      summary: "Ablehnung: PENDING-Embedding und Blobs löschen"
      tags:
      - validation
  /api/v1/value-lists/{propertyId}:
    post:
      operationId: valueList
      parameters:
      - in: path
        name: propertyId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueListRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmsValueList"
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: "Gültige Werte einer Eigenschaft (live aus dem DMS, filterbar per searchTerm)"
      tags:
      - retrieval
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
          description: OK
      security: []
      summary: Betriebsstatus der Abhängigkeiten (ohne Authentisierung)
      tags:
      - operations
components:
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: "Ungültige Anfrage: fehlender/ungültiger Parameter oder nicht lesbarer\
        \ Body. Die Framework-Fehlerbehandlung liefert heute nur den Status ohne Body;\
        \ ProblemDetail-Body ab P7 (einheitliche Fehlerform)."
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: Keine gültige d.velop-Session (Bearer-Token oder Cookie AuthSessionId);
        geliefert von SecurityConfig.
  schemas:
    ComponentHealth:
      type: object
      properties:
        detail:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - UP
          - DOWN
    ConfirmRequest:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties: {}
          description: Bestätigte Attributwerte je DMS-Property-ID. Potenziell Personendaten
            (C-4).
        dmsSourceCategory:
          type: string
          description: Vom Menschen gewählte DMS-Kategorie (Dokumentart).
        processId:
          type: string
          description: Prozess aus dem Upload (Idempotenzschlüssel).
    ConfirmationResult:
      type: object
      properties:
        documentId:
          type: string
        indexStatus:
          type: string
          enum:
          - DMS_WRITE_STARTED
          - FINALIZED_INDEX_PENDING
          - COMPLETED
          - INDEX_FAILED
        repositoryId:
          type: string
        writtenBack:
          type: boolean
    DmsDocumentMetadata:
      type: object
      properties:
        contentLanguage:
          type: string
        documentType:
          $ref: "#/components/schemas/DmsDocumentType"
        properties:
          type: array
          items:
            $ref: "#/components/schemas/DmsProperty"
    DmsDocumentType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        properties:
          type: array
          items:
            $ref: "#/components/schemas/DmsPropertyDefinition"
        score:
          type: number
          format: double
    DmsProperty:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
        values:
          type: array
          items:
            type: string
    DmsPropertyDefinition:
      type: object
      properties:
        dataType:
          type: string
          enum:
          - ALPHANUMERIC
          - NUMERIC
          - MONEY
          - DATETIME
          - DATE
          - KEY_VALUE_LIST
          - COLOR_CODE
          - DOCUMENT_TYPE
          - UNKNOWN
        hasMoreValues:
          type: boolean
        hasValueList:
          type: boolean
        id:
          type: string
        isDocumentTypeProperty:
          type: boolean
        isDynamicValueList:
          type: boolean
        isHidden:
          type: boolean
        isModifiable:
          type: boolean
        isMultiAttribute:
          type: boolean
        isSystemProperty:
          type: boolean
        mandatory:
          type: boolean
        maxLength:
          type: integer
          format: int32
        maxRowCount:
          type: integer
          format: int32
        name:
          type: string
        valueList:
          type: array
          items:
            type: string
    DmsRepository:
      type: object
      properties:
        id:
          type: string
        isAvailable:
          type: boolean
        isDefault:
          type: boolean
        isReachable:
          type: boolean
        name:
          type: string
    DmsValueList:
      type: object
      properties:
        hasMore:
          type: boolean
        values:
          type: array
          items:
            type: string
    ExtractedAttribute:
      type: object
      properties:
        confidence:
          type: number
          format: double
        propertyId:
          type: string
        sourceExcerpt:
          type: string
        value:
          type: string
        values:
          type: array
          items:
            type: string
    ExtractionResult:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedAttribute"
        documentTypeId:
          type: string
    ImportInfo:
      type: object
      properties:
        acceptedFileExtensions:
          type: array
          items:
            type: string
        maxFileSizeBytes:
          type: integer
          format: int64
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/DmsRepository"
    IngestedDocument:
      type: object
      properties:
        dmsLocation:
          type: string
        mediaType:
          type: string
        originalBlobId:
          type: string
        processId:
          type: string
    Problem:
      type: object
      additionalProperties: true
      description: Problem Details for HTTP APIs (RFC 9457). Zusätzliche Erweiterungsfelder
        sind erlaubt.
      properties:
        detail:
          type: string
          description: "Erläuterung dieses Vorkommens, ohne Roh-PII (C-4)."
        instance:
          type: string
          format: uri
          description: URI dieses Vorkommens.
        status:
          type: integer
          format: int32
          description: HTTP-Statuscode.
        title:
          type: string
          description: Kurzbeschreibung des Problemtyps.
        type:
          type: string
          format: uri
          default: about:blank
          description: URI-Referenz auf den Problemtyp (RFC 9457 § 3.1.1).
      required:
      - status
    ProcessEvent:
      type: object
      properties:
        blobId:
          type: string
        processId:
          type: string
        status:
          type: string
          enum:
          - STARTED
          - COMPLETED
          - FAILED
        step:
          type: string
          enum:
          - BLOB_STORED
          - DMS_UPLOADED
          - PREVIEW
          - TEXT_EXTRACTED
          - RETRIEVED
          - EXTRACTED
    RejectRequest:
      type: object
      properties:
        processId:
          type: string
    RetrievalResult:
      type: object
      properties:
        documentId:
          type: string
        properties:
          type: string
        repositoryId:
          type: string
        score:
          type: number
          format: double
    RetryRequest:
      type: object
      properties:
        documentTypeId:
          type: string
    SystemHealth:
      type: object
      properties:
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentHealth"
        status:
          type: string
          enum:
          - UP
          - DOWN
    ValueListRequest:
      type: object
      properties:
        extendedProperties:
          type: object
          additionalProperties:
            type: string
        multivalueExtendedProperties:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        objectDefinitionId:
          type: string
        searchTerm:
          type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      in: header
      scheme: bearer
      type: http
