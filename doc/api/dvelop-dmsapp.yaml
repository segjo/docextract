                  Source property or category ID.

                  For field mappings (`type: 0`), this can also be the literal `custom_value` to map a fixed value.
              sourceCustomValue:
                type: string
                description: Fixed value used when `source` is `custom_value`.
              type:
                type: number
                description: |-
                  Specifies the mapping element type. Possible values are:

                  * When the value is 0, the mapping element relates to a property.
                  * When the value is 1, the mapping element relates to a category.
                enum: [0, 1]

    MappingDmsObject:
      type: object
      properties:
        "_links":
          type: object
          properties:
            self:
              $ref: "#/components/schemas/Href"
            mainblobcontent:
              $ref: "#/components/schemas/Href"
              description: Relative download URL for the main document of the current version of the DMS object.
            editinoffice:
              $ref: "#/components/schemas/Href"
            pdfblobcontent:
              $ref: "#/components/schemas/Href"
            notes:
              $ref: "#/components/schemas/Href"
            children:
              $ref: "#/components/schemas/Href"
            versions:
              $ref: "#/components/schemas/Href"
            previewReadonly:
              $ref: "#/components/schemas/Href"
          description: |-
            Contains the link relations for the DMS object.

            * *mainblobcontent*: Relative download URL for the main document of the current version of the DMS object.
            * *editinoffice*: URL with placeholders for editing the document in Microsoft Office. You will only receive this URL if the
            * *administrator* has activated the function for editing Microsoft Office documents. The URL is unavailable if you are
            * *working* with Microsoft Office 365 in the cloud.
            * *pdfblobcontent*: Relative download URL for the generated (“dependent”) PDF document of the current version of the
            * *DMS* object. You receive this URL only if a generated PDF document has been created for the DMS object.
            * *notes*: Relative URL for opening the notes of the DMS object. You will only receive this URL if any notes have already
            * *been* saved for the DMS object.
            * *children*: Relative URL for the child DMS objects. You will only receive this URL if the DMS object has child items.
            * *versions*: Relative URL for retrieving and displaying the versions of a DMS object.
            * *self*: Self-link.
        id:
          type: string
          description: Specifies the document ID of the DMS object.
        sourceProperties:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
              values:
                type: object
                additionalProperties:
                  type: string
          description: |-
            Specifies the array with source properties that are available for the requested DMS object.
            If the same source property has been mapped to multiple d.3 properties that the requested DMS object possesses,
            this source property will be returned multiple times with the respective values of the d.3 property.
        sourceCategories:
          type: array
          items:
            type: string
          description: |-
            Specifies the array with the IDs of the source categories that are possible for the requested DMS object.
            The system will only return multiple categories if multiple source categories have been mapped to the d.3 category in
            which the requested DMS object is located.

    MappingSearchResult:
      type: object
      properties:
        "_links":
          type: object
          properties:
            next:
              $ref: "#/components/schemas/Href"
            self:
              $ref: "#/components/schemas/Href"
        page:
          type: number
        items:
          type: array
          items:
            type: object
            properties:
              "_links":
                type: object
                properties:
                  self:
                    $ref: "#/components/schemas/Href"
                  previewReadonly:
                    $ref: "#/components/schemas/Href"
              id:
                type: string
              sourceProperties:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                    isMultiValue:
                      type: boolean
              sourceCategories:
                type: array
                items:
                  type: string

    MappingDmsObjectVersion:
      type: object
      properties:
        "_links":
          type: object
          properties:
            mainblobcontent:
              $ref: "#/components/schemas/Href"
            pdfblobcontent:
              $ref: "#/components/schemas/Href"
            self:
              $ref: "#/components/schemas/Href"
        alterationText:
          type: string
        caption:
          type: string
        creationDate:
          type: string
          format: date-time
        id:
          type: string
        mimeType:
          type: string
        state:
          type: string
          enum: [Processing, Released, Archived]

    MappingDmsObjectVersions:
      type: object
      properties:
        "_links":
          type: object
          properties:
            self:
              $ref: "#/components/schemas/Href"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/MappingDmsObjectVersion"

    Selection:
      type: object
      properties:
        id:
          type: string
          description: The ID of the DMS object.
        caption:
          type: string
          description: The caption of the DMS object.

    SelectionList:
      type: object
      properties:
        selectionList:
          type: array
          items:
            $ref: "#/components/schemas/Selection"

    UpdateStatus:
      type: object
      properties:
        sourceId:
          type: string
        sourceProperties:
          type: object
          properties:
            properties:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  values:
                    type: array
                    items:
                      type: string

    MappingDmsObjectNotes:
      type: object
      properties:
        "_links":
          type: object
          properties:
            self:
              $ref: "#/components/schemas/Href"
        notes:
          type: array
          items:
            type: object
            properties:
              creator:
                type: object
                properties:
                  id:
                    type: string
                  displayName:
                    type: string
              text:
                type: string
              created:
                type: string
                format: date-time
        description:
          type: string
        canAddNote:
          type: boolean

    ReasonForDeletion:
      type: object
      properties:
        reason:
          type: string

    RequestId:
      description: |-
        ID of the associated request During additional requests, the ID is transferred to other
        apps and serves tracing purposes when an action is processed.
      type: string

    StoreObject:
      type: object
      properties:
        displayValue:
          type: string
          description: |-
            Specifies the display name of the item that is stored. The display name will become visible to the user in
            the storage dialog. This parameter is optional.
        filename:
          type: string
          description: |-
            Specifies the name of the file to be stored with the file extension.

            If you set this parameter, `sourceCategory` must map to a document type category.

            * The property is mandatory if you are saving a document.
            * This property is optional if you are updating a document. If the parameter is not set, the old file name will be used.
            * The property is ignored if you update a document without `contentLocationUri` or `contentUri`.
            * The property must not be set when you create or update a new dossier.
        dmsObjectId:
          type: string
          description: |-
            Specifies the ID of the DMS object to be updated. This parameter is taken into account when updating
            a DMS object with user interaction.
        alterationText:
          type: string
          description: |-
            Specifies the reason for change for the update of a DMS object. In d.3 admin, you define whether the
            parameter has to be entered. This parameter is taken into account only when updating a DMS object.
        sourceCategory:
          type: string
          description: |-
            Specifies which category should be used for mapping processing while storing. Enter the ID of the source category.

            This property must be specified except under the following circumstances:

              * The property is ignored if the parameter parentId is set and an associated default category has been defined in d.3 admin.
              * The property is ignored when you update a DMS object.
              * The property is optional if an item is stored via user action.

            If you store multiple DMS objects via user action, then only the source category of the first item in the
            storeObjects array in the storage dialog is taken into account. This source category is displayed to the
            user for all additional files to be stored.
        sourceId:
          type: string
          description: |-
            Defines the source to which the mapping that is to be used for storing belongs. The source must exist
            and the source system must be registered.

            For more information about providing a source see Mappings.

            If you do not have your own source system, you can also use the default source system of the d.3 repository.
            The default source system is always available and can be used without any further configuration. The sourceId
            of the default source system is always "/dms/r/{repositoryId}/source".
        sourcePropertiesUri:
          type: string
          description: |-
            Specifies the URL through which the DMSApp should download the item properties for the mapping processing
            and duplicate check. Before storing the DMS object, the DMSApp sends an HTTP GET request to the URL in
            order to determine the source properties for the storage process. If the sourcePropertiesUri is a relative
            URL, the user information of the registered user is also transmitted in the HTTP request (AuthSessionID).
            This makes it possible to take the current user name into account or perform a permission check, for example.
            In the case of an absolute URL, the source properties are requested anonymously. The JSON object to be
            provided is described under "sourceProperties"

            Alternatively, you can use the `sourceProperties` property.
        sourceProperties:
          description: |-
            Specifies a JSON array with source properties that are used for mapping processing and duplicate check.
            The JSON object to be provided is described under "Setting the source properties."

            Alternatively, you can use the `sourcePropertiesUri` property.
          type: object
          properties:
            properties:
              type: array
              items:
                type: object
                properties:
                  key:
                    description: |-
                      Specifies the ID of the source property. Only the properties that you specified and that were
                      configured by the administrator in the mapping are taken into account.

                      When updating a DMS object, only the properties that you specified are updated. All the other values
                      for the existing DMS object properties are retained.

                      When you want to specify the creation date (property_creation_date) of the DMS object, the
                      specification of the property is only considered when a new DMS object is saved without any
                      user interaction. For more information, see Storing a new DMS object without user interaction.
                    type: string
                  values:
                    description: |-
                      Specifies an array with the corresponding values of the item property. Even if you only want to
                      transmit one value, you must transmit this value as a JSON array.

                      You can set the d.3 document status for a DMS object when storing a new DMS object. The values
                      available are Processing, Verification and Release.

                      During a DMS object update, mappings for the d.3 document status, d.3 variant number,
                      d.3 document ID and d.3 document number are ignored.

                      Properties with the tag "read-only" are not considered while storing the item.

                      During an update without user interaction, the authenticated user must be the processor of the
                      DMS object if the existing DMS object has the Processing d.3 document status.

                      Specify the numerical value without using a thousand separator. The decimal separator is the
                      period (.). Example: For the value 1,000.20 EUR specify 1000.20.

                      Specify the date values in the format YYYY-MM-DD. Example: Enter 2014-12-05 for the
                      date 12/05/2014 (MM/DD/YYYY).

                      Enter date and time values in the format YYYY-MM-DDTHH:mm:ss+01:00. Example:
                      2015-02-18T23:59:59+01:00 for 2/18/2015 at 11:59 p.m. and 59 seconds in the time zone UTC+1
                      for standard time in Germany.
                    type: array
                    items:
                      type: string
            uniqueTag:
              type: string
              description: |-
                Specifies a unique hashcode that is used by the source for the item to be stored and by the d.3 server
                for duplicate recognition. Setting this property is optional.
            userdata:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  display:
                    type: string
                  values:
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: string
                        display:
                          type: string
                        default:
                          type: boolean
              description: |-
                Specifies an array of options that should also be displayed in the storage dialog. Specifying this
                property is optional. You can use the property only when storing with user interaction.

                For more information see Feedback using "SuccessCallback" and "Userdata".
            checkHash:
              type: string
              description: |-
                Indicates the hash of the file to be stored. The hash of the file to be stored helps you to validate
                the file saving process in a d.3 repository. If the hashes do not match, the document saving process
                is terminated with an error message.

                While saving the file, a hash of the file is generated by the server, compared with the hash that you
                generate and validated. In this case, the parameter must have the following structure:

                `HASHALGORITHM:base64encode(hashfunction(PAYLOAD))`

                The following hash algorithms are supported:

                * RIPEMD256
                * SHA256
                * SHA384
                * SHA512
                * MD5

                Always perform Base64 encoding at the byte level. Encoding a textual representation results in
                invalid hash values.
              example:
                - SHA512:
                  value: "SHA256:QmFzSHA512:xrCRnH/mKK6QVpksSpF+XcA1qWFdSX9usr0UBj6q0+ZQjvyGgv7IKCPKPz3jEYaKcpkJRhZkKfAbOPnzPZymEA=="
        contentLocationUri:
          type: string
          description: |-
            Specifies the URL for the file that was temporarily uploaded. For more information, see Providing a file via temporary upload.

            Alternatively, you can use the `contentUri` property.

            If you set this parameter, `sourceCategory` must map to a document type category. 

            This property is optional if you want to update a DMS object or create a dossier.
        contentUri:
          type: string
          description: |-
            Specifies the relative URL through which the DMSApp downloads the file to be stored. For more information, see Providing a
            file via temporary upload.

            Alternatively, you can use the `contentLocationUri` property.

            If you set this parameter, `sourceCategory` must map to a document type category.

            This property is optional if you want to update a DMS object or create a dossier.
        parentId:
          type: string
          description: |-
            Specifies the DMS object ID of the dossier with which the item to be stored should be linked. If the storage process is
            successful, the stored item is linked to the corresponding dossier. If the item to be stored is recognized as a duplicate,
            the already existing item is linked to the dossier.

            However no duplicate check performed, when you want to link a dossier to another dossier.

            This property is ignored when you update a DMS object.
        successCallbackUri:
          type: string
          description: |-
            Specifies the URL that is opened via HTTP POST when the storage process was performed successfully.
            The URL must be relative. For more information, see Feedback using "SuccessCallback" and "Userdata".

            This property is optional. You can use the property only when storing with user interaction.

    ErrorPageModel:
      type: object
      properties:
        severity:
          $ref: "#/components/schemas/Severity"
        reason:
          type: string
          description: An optional short description of why the error has occurred. This text is used as the error message's title.
        hint:
          type: string
        details:
          type: string
        errorCode:
          type: number
          description: An optional error code, as returned by d.3 server.
        requestId:
          $ref: "#/components/schemas/RequestId"

    LinkDocumentErrorPageModel:
      type: object
      properties:
        dmsObjectId:
          type: string
          description: The ID of the DMS object that could not be linked or unlinked.
        errorPageModel:
          $ref: "#/components/schemas/ErrorPageModel"

    LinkDocumentErrorPageModels:
      type: array
      description: An array with error messages for a link operation.
      items:
        $ref: "#/components/schemas/LinkDocumentErrorPageModel"

    SearchFilter:
      type: object
      properties:
        "_links":
          type: object
          properties:
            self:
              $ref: "#/components/schemas/Href"
            searchResult:
              $ref: "#/components/schemas/Href"
          description: |-
            * *self*: Relative URL for retrieving, updating or deleting the search filter. Only
              returned after creating or updating the search filter.
            * *searchResult*: Relative, templated URL for retrieving the search results that match
              the criteria of the search filter.
        timeToLive:
          type: number
          description: |-
            Specifies, in seconds, how long the search filter is stored before it expires. If you
            do not specify a value or specify 0, the search filter is stored for 30 minutes.
        value:
          $ref: "#/components/schemas/SearchRequest"

    SearchRequest:
      type: object
      properties:
        id:
          type: string
          description: |-
            The generated ID of the search filter. This property is read-only and is ignored when
            you create a new search filter.
        fulltext:
          type: string
          description: Specifies a full-text keyword.
        objectDefinitionIds:
          type: array
          items:
            type: string
          description: |-
            Sets the categories used for searching items. You can define at least one category. If
            this value is not specified, the search is done across all categories in the d.3
            repository.
        properties:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: |-
            Specifies the search restrictions based on the properties of documents and dossiers.
            You can define at least one value for each property. See the properties parameter of
            the search results endpoint for details on the supported value formats.
        sortType:
          type: string
          enum: [Property, ObjectDefinition, Relevanz]
          description: Specifies the kind of value that sortId refers to.
        sortId:
          type: string
          description: Specifies the ID of the property that is used to sort the result.
        sortAscending:
          type: boolean
          description: Specifies the direction of the sort order.

  parameters:
    repositoryId:
      name: repositoryId
      in: path
      required: true
      description: The ID of the repository
      schema:
        type: string

    mappingSourceId:
      name: sourceid
      in: query
      required: true
      description: Defines the source to which the mapping used to retrieve the details of the DMS object belongs.
      schema:
        type: string

    mappingDmsObjectId:
      name: dmsObjectId
      in: path
      required: true
      description: Specifies the document ID of the DMS object for which you want to request or view the details.
      schema:
        type: string

    linkParentDmsObjectId:
      name: parentDmsObjectId
      in: path
      required: true
      description: Specifies the document ID of the DMS object to which you want to link or unlink your subordinate DMS objects.
      schema:
        type: string

    linkChildDmsObjectId:
      name: childDmsObjectId
      in: path
      required: true
      description: Specifies the document ID of the child DMS object that you want to link or unlink to the parent DMS object.
      schema:
        type: string

    mappingVersionId:
      name: versionId
      in: path
      required: true
      description: Specifies the version ID of the DMS object for which you want to request or view the details.
      schema:
        type: string

    searchFilterId:
      name: searchFilterId
      in: path
      required: true
      description: Specifies the ID of the search filter.
      schema:
        type: string

    isReadonly:
      name: isReadonly
      in: query
      required: false
      description: Specifies whether the preview is displayed in read-only mode.
      schema:
        type: boolean

    searchObjectdefinitionIds:
      name: objectdefinitionids
      in: query
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
      description: |-
        Sets the categories used for searching items. You can define at least one category. Specify the
        ID of a category. If this value is not specified, the search is done across all categories in
        a d.3 repository.

    searchFulltext:
      name: fulltext
      in: query
      schema:
        type: string
      description: Specifies a full-text keyword.

    searchProperties:
      name: properties
      in: query
      content:
        application/json:
          schema:
            type: object
            properties:
              property_document_id:
                type: array
                items:
                  type: string
              property_filetype:
                type: array
                items:
                  type: string
              property_document_number:
                type: array
                items:
                  type: string
              property_state:
                type: array
                items:
                  type: string
                  enum: [Be, Pr, Fr, Ar]
              property_editor:
                type: array
                items:
                  type: string
              property_filename:
                type: array
                items:
                  type: string
              property_creation_date:
                type: array
                items:
                  type: string
                description: |-
                  *Format:* YYYY-MM-DD
              property_size:
                type: array
                items:
                  type: string
                description: |-
                  when searching for the file size, the size must be specified in bytes
                  and as an integer. A search within a specific range can be done
                  using the separator pipe and minus character (|-): Search for documents
                  whose document file is smaller than or equal to 1024 bytes with the expression
                  {"property_size":["|-1024"]}
              property_last_modified_date:
                type: array
                items:
                  type: string
                description: |-
                  *Format:* YYYY-MM-DD
              property_last_alteration_date:
                type: array
                items:
                  type: string
                description: |-
                  *Format:* YYYY-MM-DD
              property_access_date:
                type: array
                items:
                  type: string
                description: |-
                  *Format:* YYYY-MM-DD
              property_remark:
                type: array
                items:
                  type: string
              property_colorcode:
                type: array
                items:
                  $ref: "#/components/schemas/ColorCode"
              property_variant_number:
                type: array
                items:
                  type: string
            additionalProperties:
              type: array
              items:
                type: string
            example:
              - example1:
                description: for searching the file type "docx".
                value: { "property_filetype": ["docx"] }
              - example2:
                description: for searching for items with the file type "docx" or "pdf".
                value: { "property_filetype": ["docx", "pdf"] }
              - example3:
                description: for searching for items with the customer number (advanced property with the ID "227") "KND001" and the file type “pdf”.
                value: { "227": ["KND001"], "property_filetype": ["pdf"] }
      description: |-
        Specific values for the properties parameter related to the various options for restricting
        the result in a targeted way:

        1. Search for a numeric value or a money value:
           Specify the value without using a thousand separator. The decimal separator is the
           period (.). Example: For the value 1,000.20 EUR specify 1000.20.

        2. Search for a date and time:
           Specify the date in the format YYYY-MM-DD. Example: Enter 2014-12-05 for the
           date 12/05/2014 (MM/DD/YYYY).
           Time is specified in the format YYYY-MM-DDTHH:mm:ss+01:00. You must encode
           the plus character (+) with %2b. Example: 2015-02-18T23:59:59%2b01:00 for
           02/18/2015 at 11:59 p.m. and 59 seconds in the time zone UTC+1 for standard
           time in Germany.

        3. Search for items that are located in a specific range:
           To search in a range, use a combination of the pipe and minus character (|-) as
           separators. Examples for a numeric field with the ID "231":

           * Values greater than or equal to 100: {"231":["100|-"]}
           * Values smaller than or equal to 100: {"231":["|-100"]}
           * Values between 100 and 200: {"231":["100|-200"]}

    multiPreviewSelectionListUrl:
      name: multiPreviewSelectionListUrl
      in: query
      required: true
      description: |-
        A relative URL pointing to a selection list of DMS objects to display in the MultiPreview.
        This must either be the URL of a createSelection resource (/r/{repositoryId}/sel/{id}) or a
        relative URL provided by an app. Absolute URLs are not supported.

        If it points to an app-provided URL, DMSApp performs an anonymous GET request against it
        (no bearer token or session information is forwarded) and expects a JSON response body
        according to the SelectionList schema, within 30 seconds and up to 10MB. The response must
        include a Content-Length header, otherwise it is rejected.
      schema:
        type: string
        format: uri
        example: /dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/sel/3fa85f64-5717-4562-b3fc-2c963f66afa6