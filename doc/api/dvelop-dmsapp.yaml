  /r/{repositoryId}/srm:
    get:
      summary: Retrieving and viewing the results of a search operation
      description: |-
        When retrieving and viewing the results of a search operation, you can restrict the number of results displayed to you by specifying a particular source plus the associated source categories and source properties. You can also restrict your search results using a full-text search term. The Defining a source system chapter explains how to create a source for mapping.
      tags:
        - DmsObjects
      operationId: getSearchResultWithMapping
      parameters:
        - $ref: "#/components/parameters/repositoryId"
        - $ref: "#/components/parameters/searchFulltext"
        - $ref: "#/components/parameters/mappingSourceId"
        - name: sourceproperties
          in: query
          description: |-
            Specifies the search restriction based on the properties of documents and dossiers from the
            perspective of the source. Species the ID of the mapped source properties in order to restrict
            a search procedure to certain criteria. The search procedure is executed based on the mapping.

            Regular expressions specified by the administrator during mapping are ignored.

            You must specify the search restrictions as a JSON object. You can define at least one value
            for each property.

            Examples (not encoded):
            * `sourceproperties={"myprop1_ID":["Test e-mail 1"]}`: for a search for items with the d.3 property with the value
              "Test e-mail 1" that has been mapped to the source property with the ID "myprop1_ID".
            * `sourceproperties={"myprop1_ID":["Test e-mail 1", "Test e-mail 2"]}`: for a search for items with the d.3 property
               with the value "Test e-mail 1" or "Test e-mail 2" that has been mapped to the source property with the ID
               "myprop1_ID".

            Restriction in relation to the definition of a search operation: You can also define multiple values for a parameter,
            provided that facets have been configured for the corresponding d.3 property. If no facets for viewing have been
            configured for the d.3 property, the last value is always adopted for the search operation.
            You cannot use source properties, which are mapped to the common properties for comment fields (Comment 1 - 4),
            for the Search feature, since searching for individual comment fields in the d.3 repository is not supported.
            You can also use several properties as search restrictions simultaneously.

            Examples (not encoded):
            * `sourceproperties={"myprop1_ID":["Test e-mail 1"],"myprop2_ID":["John Doe"]}`: for a search for items with the d.3
              property with the value "Test e-mail 1", that has been mapped to the source property with the ID "myprop1_ID"
              and the d.3 property with the value "John Doe" what has been mapped to the source property with the ID
              "myprop2_ID".

            ### Note
            Specific values for the sourceproperties parameter related to the various options for
            restricting the result in a targeted way:

            1. Search for a numeric value or a money value:
               Specify the value without using a thousand separator. The decimal separator is the
               period (.). Example: For the value 1,000.20 EUR specify 1000.20.

            2. Search for a date and time:
               Specify the date in the format YYYY-MM-DD. Example: Enter 2014-12-05 for the
               date 12/05/2014 (MM/DD/YYYY).
               Time is specified in the format YYYY-MM-DDTHH:mm:ss+01:00. You must encode
               the plus character (+) with %2b. Example: 2015-02-18T23:59:59%2b01:00 for
               02/18/2015 at 11:59 p.m. and 59 seconds in the time zone UTC+1 for standard
               time in Germany.

            3. Search for items that are located in a specific range:
               To search in a range, use a combination of the pipe and minus character (|-) as
               separators. Examples for a numeric field with the ID "231":
               * Values greater than or equal to 100: {"231":["100|-"]}
               * Values smaller than or equal to 100: {"231":["|-100"]}
               * Values between 100 and 200: {"231":["100|-200"]}
          schema:
            type: object
          examples:
            SourceProperties:
              value:
                {
                  "myprop1_ID": ["Test e-mail 1", "Test e-mail 2"],
                  "myprop2_ID": ["John Doe"],
                }
        - name: sourcecategories
          in: query
          description: |-
            Sets the source categories used for searching items.You can specify one or more source categories.
            You must specify the search restrictions as a JSON array. If you do not specify a source category,
            the search will be performed across all the categories in a d.3 repository.

            Source properties that are not in all given source categories are ignored. This means if you specify
            no source categories, only source properties that are in all source categories are used for the search.

            The search procedure is executed based on the mapping.
          schema:
            type: array
            items:
              type: string
          examples:
            SourceCategories:
              value: ["mycategory1_ID", "mycategory2_ID"]
        - name: sourcepropertysort
          in: query
          description: Specifies the ID of the mapped source property that is used to sort the result. If no sort property is specified, the default sort order using the Last modified sort criteria is applied.
          schema:
            type: string
        - name: ascending
          in: query
          description: |-
            Specifies the direction of the sort order.

            * ascending=true: results in an ascending sort order (from small to large (A-Z) and from old to young).
            * ascending=false: results in an descending sort order (from large to small (Z-A) and from young to old).

            If the ascending parameter is not explicitly specified, the ascending sort order is applied. This is not true for the default sort order: If the Last modified criteria is used for sorting and the sort order is not specified, the sort order will be descending.

            In addition to this, dossiers are displayed prior to documents in the result list. Within documents and dossiers, the items are sorted by the specified sorting criterion.
          schema:
            type: boolean
        - name: page
          in: query
          description: |-
            Specifies which page of the result list is requested. If this parameter is not transferred, Page 1 will be requested.
          schema:
            type: number
        - name: pageSize
          in: query
          description: |-
            Specifies how many items are displayed per page. If this parameter is not transferred, 25 items per page will be requested.
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/MappingSearchResult"
              examples:
                SearchResult:
                  value:
                    {
                      "_links":
                        {
                          "next":
                            {
                              "href": "/dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/srm?...page=2",
                            },
                          "self":
                            {
                              "href": "/dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/srm?...page=1",
                            },
                        },
                      "page": 1,
                      "items":
                        [
                          {
                            "_links":
                              {
                                "self":
                                  {
                                    "href": "/dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/o2m/D000000123",
                                  },
                                "previewReadonly":
                                  {
                                    "href": "/dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/o2/D000000123/preview?isReadonly=true",
                                  },
                              },
                            "id": "D000000123",
                            "sourceProperties":
                              [
                                {
                                  "key": "myprop1_ID",
                                  "value": "Test E-Mail 1",
                                  "isMultiValue": false,
                                },
                                {
                                  "key": "myprop2_ID",
                                  "value": "Max Mustermann",
                                  "isMultiValue": true,
                                },
                              ],
                            "sourceCategories": ["mycategory1_ID"],
                          },
                        ],
                    }
            text/html:
              schema: {}

  /r/{repositoryId}/blob/chunk:
    post:
      summary: Providing a file via temporary upload
      description: |-
        This chapter explains how to make a file temporarily available via temporary upload.
        Temporary upload is especially useful for large files. Using the (contentLocationUri)
        URL for the file that was temporarily uploaded, you can then store the DMS object.

        Perform the following steps to upload a file temporarily:
          * Post the first chunk of a file to the URL /dms/r/{repositoryId}/blob/chunk/
          * Post additional chunks of the file to the returned contentLocationUri /dms/r/{repositoryId}/blob/chunk/{chunkId}

        Note the following when uploading multiple chunks:

          * The chunks can only be uploaded sequentially.
          * The order of the HTTP POST request for the chunks must be strictly adhered to.
          * If an error occurs during an HTTP POST request (e.g. HTTP status code is not 200), then you must
            re-upload the file in all the chunks. Individual chunks cannot be reuploaded.
      tags:
        - DmsObjects
      operationId: uploadBlobChunk
      parameters:
        - $ref: "#/components/parameters/repositoryId"
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            examples:
              File:
                value: "file content"
      responses:
        "201":
          headers:
            Location:
              schema:
                type: string
                example:
                  - BlobChunkUri:
                      value: /dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/blob/chunk/2018-01-01_temp_master_file_user1_44f7-95a6-58b8400ecf43
              description: The contentLocationUri of the uploaded file, use for subsequent calls
          description: |-
            The first chunk was successfully uploaded.
        "200":
          description: |-
            A chunk was successfully uploaded.
        "404":
          description: |-
            The resource was not found. An unknown repository ID was specified, for example.

  /r/{repositoryId}/o2m:
    post:
      summary: Storing a new DMS object without user interaction
      description: |-
        You can store a new DMS object automatically in the d.3 repository without the need for action by the user.
        No *Validate* hooks are executed in d.3 server during storing without user interaction. Mappings are required
        before the action can be performed. In the Basic information about mapping chapter, you can find general
        information for helping you to create mapping.

        Perform the following steps to store a DMS object:

        * Provide the file to be stored (optional)
        * Open the URL for storing a new DMS object

        ### Provide the file to be stored (optional)

        If you want to create a dossier, you do not need to provide the file.

        In order for files to be stored, they must be provided to the DMSApp. You can provide the files
        in two ways:

        1. Providing a file with a URL

           When storing DMS objects, provide the URL leading to a file in the contentUri property.
           Before the DMS object is stored, the DMSApp will download the file via the specified URL
           (contentUri). The URL must be a relative URL. The respective user’s information is also
           transmitted in the HTTP request during the download (AuthSessionID).
           The AuthSessionID can be used to identify the user, e.g. to perform a permission check.

        2. Providing a file with a temporary upload

           See: /dms/r/{repositoryId}/blob/chunk/

        ### Open the URL for storing a new DMS object

        Perform an HTTP POST request to this URL with the required properties as Body.
      tags:
        - DmsObjects
      operationId: storeDmsObjectWithMapping
      parameters:
        - $ref: "#/components/parameters/repositoryId"
      requestBody:
        required: true
        content:
          application/hal+json:
            schema:
              $ref: "#/components/schemas/StoreObject"
            examples:
              StoreWithContentLocationUri:
                description: |-
                  If no assignment is configured for the d.3 document status, the document status *Release
                  (Release)* is used by default for the DMS object. The Status property must be assigned by
                  the administrator if you want to use a different document status during storage.

                  If the call is successful, the URL is returned to the DMS object in the Location header:

                  If linking an item to a dossier (parentId) fails, you will receive the URL to the DMS
                  object in the Location header, as well as an additional notification that
                  the linking process has failed.
                value:
                  {
                    "filename": "myfile.txt",
                    "sourceCategory": "mycategory1_ID",
                    "sourceId": "/myapp/sources/mysource",
                    "contentLocationUri": "/dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/blob/chunk/2018-01-01_temp_master_file_user1_44f7-95a6-58b8400ecf43",
                    "sourceProperties":
                      {
                        "properties":
                          [
                            {
                              "key": "myprop1_ID",
                              "values": ["Please verify the XYZ invoice"],
                            },
                            {
                              "key": "myprop2_ID",
                              "values":
                                ["Name1@contoso.com", "Name2@samplecompany.de"],
                            },
                          ],
                      },
                  }
              StoreSimple:
                description: |-
                  A simple JSON object could appear as follows:
                value:
                  {
                    "filename": "myfile.txt",
                    "alterationText": "updated file",
                    "sourceCategory": "mycategory1_ID",
                    "sourceId": "/myapp/sources/mysource",
                    "contentUri": "/myapp/sources/mysource/myfile.txt",
                    "sourcePropertiesUri": "/myapp/sources/mysource/myfile.haljson",
                  }
              StoreWithUniqueId:
                description: |-
                  The following JSON object contains userdata and the properties (properties). uniqueTag is set at the same time for the duplicate
                  check.The dossier ID is set in the parentId parameter in order to link the DMS object to be recreated:
                value:
                  {
                    "displayValue": "Please verify the XYZ invoice",
                    "filename": "myfile.txt",
                    "alterationText": "updated file",
                    "sourceCategory": "mycategory1_ID",
                    "sourceId": "/myapp/sources/mysource",
                    "parentId": "P123456789",
                    "contentLocationUri": "/dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/blob/chunk/2018-01-01_temp_master_file_user1_44f7-95a6-58b8400ecf43",
                    "successCallbackUri": "/myapp/sources/mysource/myfile/success",
                    "sourceProperties":
                      {
                        "properties":
                          [
                            {
                              "key": "myprop1_ID",
                              "values": ["Please verify the XYZ invoice"],
                            },
                            {
                              "key": "myprop2_ID",
                              "values":
                                ["Name1@contoso.com", "Name2@samplecompany.de"],
                            },
                          ],
                        "userdata":
                          [
                            {
                              "key": "postProcessingOption",
                              "display": "My post processing options",
                              "values":
                                [
                                  {
                                    "value": "1",
                                    "display": "Action 1",
                                    "default": false,
                                  },
                                  {
                                    "value": "2",
                                    "display": "Default action 2",
                                    "default": true,
                                  },
                                  {
                                    "value": "3",
                                    "display": "Action 3",
                                    "default": false,
                                  },
                                ],
                            },
                          ],
                        "uniqueTag": "123456789",
                        "checkHash": "MD5:ClJzBZf7T/oB/BF9nnHjqQ==",
                      },
                  }
      responses:
        "201":
          content:
            application/json:
              examples:
                NoRightsToLink:
                  summary: No rights to link the document with the dossier manually
                  value:
                    {
                      "reason": "You do not have the right to link the document with the dossier manually. Nevertheless, the document was successfully saved. The document may be automatically linked on the server.",
                      "severity": 1,
                    }
          headers:
            Location:
              schema:
                type: string
                description: The URL of the newly created resource. Save this URL to delete the DMS object later.
                example:
                  - ObjectMappingUri:
                      value: /dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/o2m/D0001234?sourceId=%2Fmyapp%2Fsources%2Fmysourc
          description: |-
            If the call was successful and there is detailed information on the processing result of the storage operation,
            the detailed information is returned in the response. With the help of the information, you can decide whether
            further processing steps are necessary for the DMS object. For more information see Format of the response for
            successful requests with detailed information.

            If storing the DMS object fails, an appropriate answer is displayed. For more information see Response format
            for errors.

  /r/{repositoryId}/o2m/{dmsObjectId}:
    get:
      summary: Retrieving and viewing the details of a DMS object
      description: |-
        You can retrieve the details of a DMS object as a JSON representation or view the detail view for a DMS object.
        When retrieving the details as a JSON representation, you can enter a specific source from a source system to
        define which source properties and source categories are determined. If you do not specify a source, only the ID
