                          "versions":
                            {
                              "href": "/dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/o2m/D000000123/v/",
                            },
                        },
                      "id": "D000000123",
                      "sourceProperties":
                        [
                          {
                            "key": "myprop1_ID",
                            "value": "value of property 1",
                          },
                          {
                            "key": "myprop2_ID",
                            "value": "value of property 2 in row 2",
                            "values":
                              {
                                "2": "value of property 2 in row 2",
                                "4": "value of property 2 in row 4",
                              },
                          },
                        ],
                      "sourceCategories": ["mycategory2_ID"],
                    }

            text/html:
              schema: {}
    put:
      summary: Updating a DMS object without user interaction
      description: |-
        You can update an existing DMS object in a d.3 repository without the need for action by the user.
        No Validate hooks are executed in d.3 server while updating the DMS object without user interaction.
        Mappings are required before the action can be performed.
      tags:
        - DmsObjects
      operationId: updateDmsObjectWithMapping
      parameters:
        - $ref: "#/components/parameters/repositoryId"
        - $ref: "#/components/parameters/mappingDmsObjectId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreObject"
            examples:
              UpdateWithContentLocationUri:
                value:
                  {
                    "filename": "myfile.txt",
                    "alterationText": "updated file",
                    "sourceCategory": "mycategory1_ID",
                    "sourceId": "/myapp/sources/mysource",
                    "contentLocationUri": "/dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/blob/chunk/2018-01-01_temp_master_file_user1_44f7-95a6-58b8400ecf43",
                    "sourceProperties":
                      {
                        "properties":
                          [
                            {
                              "key": "myprop1_ID",
                              "values": ["Please verify the XYZ invoice"],
                            },
                            {
                              "key": "myprop2_ID",
                              "values":
                                ["Name1@contoso.com", "Name2@samplecompany.de"],
                            },
                          ],
                      },
                  }
      responses:
        "200":
          description: OK
    delete:
      summary: Deleting the current version of a DMS object without user interaction
      description: |-
        You can delete the current version of a DMS object in a d.3 repository without the need for action by the user.
      tags:
        - DmsObjects
      operationId: deleteDmsObjectWithMapping
      parameters:
        - $ref: "#/components/parameters/repositoryId"
        - $ref: "#/components/parameters/mappingDmsObjectId"
      requestBody:
        content:
          application/hal+json:
            schema:
              $ref: "#/components/schemas/ReasonForDeletion"
            examples:
              ReasonForDeletion:
                value: { reason: "Created accidentally." }
      responses:
        "200":
          description: |-
            If the call is successful, HTTP 200 OK is returned: If the body is empty, the entire DMS object was deleted. If the DMS object contains more versions, the body contains additional link relations. If it contains the self link relation, it means there are more versions for the DMS object and you can call up more details for the DMS object using this URL. You can delete the next version of the DMS object using the delete or deleteWithReason link relations. If these link relations are not available, it means that the user is not authorized to delete the next version.
          content:
            application/hal+json:
              examples:
                DeleteWithReason:
                  value:
                    {
                      "_links":
                        {
                          "self":
                            {
                              "href": "/dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/o2m/A00000001",
                            },
                          "delete":
                            {
                              "href": "/dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/o2m/A00000001",
                            },
                        },
                    }

