  /new:
    get:
      summary: Displaying the storage dialog
      description: |-
        The storage dialog for the *Storage* feature allows you to save and update DMS objects.

        After you open the storage dialog in the browser and enter values, you are shown the link for
        calling the displayed dialog, including your entered values, in the URL. You can use this link as
        a bookmark in the browser, for example, so that you can always display the storage dialog with the
        entered values. This chapter explains how this link is structured.

        Use cases for various calls of the storage dialog:

        1. Storage in a category: Add the part objectdefinitionid=<category ID> to the URL.

           `https://<Base address>/dms/new/?repositoryid=<RepositoryID>&objectdefinitionid=RECH `

        2. Storage with an alphanumeric property: Add properties={"227":"KND001"} (not encoded) to the properties parameter in the URL to propose the property field with the RID 227 (customer number) and the value "KND001" as the customer number.

           `https://<Base address>/dms/new/?repositoryid=<RepositoryID>&objectdefinitionid=RECH&properties=%7B%22227%22%3A%22KND001%22%7D`

        3. Storage with multiple properties: Add properties={"227":"KND001","231":"-100"} (not encoded) to the properties parameter in the URL to propose the property field with the RID 227 (customer number) with the value "KND001" and the property field with the RID 231 (invoice amount) with the value -100.

           `https://<Base address>/dms/new/?repositoryid=<RepositoryID>&objectdefinitionid=RECH&properties=%7B%22227%22%3A%22KND001%22%2C%22231%22%3A%22-100%22%7D`

        4. Storage with multi-values: Add properties={"232":{"1":"Name1@contoso.com", "2":"Name2@contoso.com"}} (not encoded) to the properties parameter in the URL to propose the property field with the RID 232 (e-mail) with the values "Name1@contoso.com" and "Name2@contoso.com".

           `https://<Base address>/dms/new/?repositoryid=<RepositoryID>&objectdefinitionid=RECH&properties=%7B%22227%22%3A%22KND001%22%2C%22231%22%3A%22-100%22%2C%22232%22%3A%7B%221%22%3A%22Name1%40contoso.com%22%2C%20%222%22%3A%22Name2%40contoso.com%22%7D%7D`

      tags:
        - Dialogs
      operationId: getNewDmsObjectDialog
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [dossier]
          description: Specifies the category (storage type) in the storage dialog. The only possible value is dossier. type dossier opens the storage dialog for creating dossiers.
        - name: repositoryId
          in: query
          schema:
            type: string
          description: Defines the repository ID.
        - name: objectdefinitionid
          in: query
          schema:
            type: string
          description: Specifies the category to be selected in the storage dialog. Specify the ID of a category. If you do not make a specification, no category is selected.
        - name: properties
          in: query
          schema:
            type: object
            properties:
              property_document_number:
                type: string
              property_variant_number:
                type: string
              property_state:
                type: string
                enum: [Be, Pr, Fr, Ar]
              property_editor:
                type: string
              property_remark1:
                type: string
              property_remark2:
                type: string
              property_remark3:
                type: string
              property_remark4:
                type: string
              property_colorcode:
                $ref: "#/components/schemas/ColorCode"
            additionalProperties:
              oneOf:
                - type: object
                  additionalProperties:
                    type: string
                - type: array
                  items:
                    type: string
          description: |-
            A JSON object that you can use to set the following properties:

            * Document number: property_document_number
            * Variant number: property_variant_number
            * Document status: property_state (the possible values are Be for Processing (Bearbeitung), Pr for Verification (Prüfung), Fr for Release (Freigabe) and AR for Archive (Archiv).
            * Editor: property_editor (d.3 user ID)
            * Remark 1: property_remark1
            * Remark 2: property_remark2
            * Remark 3: property_remark3
            * Remark 4: property_remark4
            * Color code: property_colorcode (is an integer value between 1 and 24 that corresponds to the number of the color code you want to assign).

            You can also set values for advanced properties. The ID of the property corresponds to the identifier (RID) of the property.
            You can find the ID in the URL in the address bar of your browser. After you open the storage dialog in the browser and enter values,
            you are shown the link for calling the displayed dialog, including your entered values, in the URL.

            For multi-values, you must also set the row number.
          examples:
            Properties:
              value:
                {
                  "property_document_number": "123456",
                  "property_variant_number": "1",
                  "property_state": "Be",
                  "property_editor": "d3user",
                  "property_remark1": "Remark 1",
                  "property_remark2": "Remark 2",
                  "property_remark3": "Remark 3",
                  "property_remark4": "Remark 4",
                  "property_colorcode": "1",
                  "227": ["KND001"],
                  "232": { "1": "Name1@contoso.com", "2": "Name2@contoso.com" },
                }
      responses:
        "200":
          description: |-
            ### Opening the URL for the storage dialog
            You have generated a URL for the storage dialog. If you open the URL in the browser,
            the storage dialog is loaded with the transferred parameters.

  /r/{repositoryId}/new:
    post:
      summary: Storing new or updating existing DMS objects with user interaction
      description: |-
        You can open the Storage feature to store new DMS objects or update exsitng DMS objects with properties and files. Mappings are
        required before the action can be performed.

        ### Provide the file to be stored (optional)

        The "Providing a file via temporary upload" chapter explains how to obtain the contentUri or contentLocationUri. This parameter
        is required to create a storage dialog for a new DMS object.

        If you want to create a dossier, you do not need to provide the file.

        ### Displaying the storage dialog with predefined properties and files

        Open the URL that you received in the Location header in the browser to show the created storage
        dialog to the user. The user can edit the properties and complete the storage of the DMS objects.

        ### Perform more actions after storing (optional)

        The URL is opened if the successCallbackUri parameter is specified while creating the storage dialog
        and the user has successfully completed the storage process. You can perform additional steps after
        performing this action
      tags:
        - Dialogs
      operationId: postNewDmsObjectDialog
      parameters:
        - $ref: "#/components/parameters/repositoryId"
      requestBody:
        content:
          application/hal+json:
            schema:
              type: object
              properties:
                storeObjects:
                  type: array
                  items:
                    $ref: "#/components/schemas/StoreObject"
            examples:
              StoreObjectsWithDialog:
                value:
                  {
                    "storeObjects":
                      [
                        {
                          "filename": "myfile.txt",
                          "sourceCategory": "mycategory1_ID",
                          "sourceId": "/myapp/sources/mysource",
                          "contentLocationUri": "/dms/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/blob/chunk/2018-01-01_temp_master_file_user1_44f7-95a6-58b8400ecf43",
                          "sourceProperties":
                            {
                              "properties":
                                [
                                  {
                                    "key": "myprop1_ID",
                                    "values": ["Please verify the XYZ invoice"],
                                  },
                                  {
                                    "key": "myprop2_ID",
                                    "values":
                                      [
                                        "Name1@contoso.com",
                                        "Name2@samplecompany.de",
                                      ],
                                  },
                                ],
                            },
                        },
                      ],
                  }
              UpdateObjectsWithDialog:
                value:
                  {
                    "storeObjects":
                      [
                        {
                          "dmsObjectId": "D123456789",
                          "displayValue": "Please verify the XYZ invoice",
                          "filename": "myfile.txt",
                          "contentLocationUri": "/dms/blob/chunk/2016-May-24-14-20-26-393-1720.part",
                          "sourceId": "/myapp/sources/mysourcel",
                          "sourcePropertiesUri": "/myapp/sources/mysourcel/properties/myfile.haljson",
                          "successCallbackUri": "/myapp/sources/mysourcel/success/myfile",
                        },
                      ],
                  }
      responses:
        "201":
          description: CREATED
          headers:
            Location:
              schema:
                type: string
                description: The URL of the newly created storage dialog.
  /s:
    get:
      summary: Display the search dialog without specifying a repository
      description: |-
        You can use the Search feature to find saved items in the repository, provided that you
        have the appropriate authorizations. Based on their area of responsibility, users
        frequently search for the same items, which they can find quickly by using selected
        properties and categories. You can simplify the search process by providing users with
        a predefined search operation. In the search operation, you have already defined the
        values that your users otherwise have to enter repeatedly.

        To make a predefined search operation available, transfer the parameters of the URL.

        Call the search operation without specifying a specific repository. In this case, the last
        selected repository is used for the search operation. However, the user can change the
        repository at any time.query
      tags:
        - Dialogs
      operationId: getSearchDialog
      parameters:
        - $ref: "#/components/parameters/searchObjectdefinitionIds"
        - $ref: "#/components/parameters/searchProperties"
        - $ref: "#/components/parameters/searchFulltext"
        - name: showresultlist
          in: query
          schema:
            type: boolean
          description:
            If values are available for a search operation, this specifies whether the
            search operation is executed directly and the results of the search query are displayed
        - name: repositoryId
          in: query
          schema:
            type: string
          description: Defines the repository ID.
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema: {}

  /r/{repositoryId}/s:
    get:
      summary: Display the search dialog for a specific repository
      description: |-
        You can use the Search feature to find saved items in the repository, provided that you
        have the appropriate authorizations. Based on their area of responsibility, users
        frequently search for the same items, which they can find quickly by using selected
        properties and categories. You can simplify the search process by providing users with
        a predefined search operation. In the search operation, you have already defined the
        values that your users otherwise have to enter repeatedly.

        To make a predefined search operation available, transfer the parameters of the URL.

        You call the search operation for a specific repository, which means that the user can
        no longer change the repository.
      tags:
        - Dialogs
      operationId: getSearchDialogForRepository
      parameters:
        - $ref: "#/components/parameters/searchObjectdefinitionIds"
        - $ref: "#/components/parameters/searchProperties"
        - $ref: "#/components/parameters/searchFulltext"
        - $ref: "#/components/parameters/repositoryId"
        - name: showresultlist
          in: query
          schema:
            type: boolean
          description: |-
            If values are available for a search operation, this specifies whether the search operation is executed directly
            and the results of the search query are displayed

      responses:
        "200":
          description: OK
          content:
            text/html:
              schema: {}

  /r/{repositoryId}/sr:
    get:
      summary: Display the search results
      description: |-
        When defining search operations, you can specify that only the result list is to be displayed. Your users can then
        view the results of a search directly and no longer have to specify the individual properties. The result list makes
        it easy for your users to continue their work.
      tags:
        - Dialogs
      operationId: getSearchResultsDialog
      parameters:
        - $ref: "#/components/parameters/searchObjectdefinitionIds"
        - $ref: "#/components/parameters/searchProperties"
        - $ref: "#/components/parameters/searchFulltext"
        - $ref: "#/components/parameters/repositoryId"
        - name: propertysort
          in: query
          description: |-
            Specifies the ID of the property that is used to sort the result.

            * Caption/Title: property_caption
            * Owner: property_owner
            * File type: property_filetype
            * Remark: property_remark
            * Last access: property_access_date
            * Editor: property_editor
            * Document ID: property_document_id
            * Document number: property_document_number
            * File size: property_size
            * Document status: property_state
            * Last modified: property_last_modified_date
            * Last file update: property_last_alteration_date
            * Color code: property_colorcode
            * Category: property_category
            * Created on: property_creation_date
            * Last access: property_access_date

            You can also sort the result list based on an advanced property. The ID of the
            property corresponds to the ID (RID) of a property that you can determine for
            each advanced property in d.3 admin.
          schema:
            type: string
            default: property_last_modified_date
            enum:
              - property_caption
              - property_owner
              - property_filetype
              - property_remark
              - property_editor
              - property_document_id
              - property_document_number
              - property_size
              - property_state
              - property_last_modified_date
              - property_last_alteration_date
              - property_colorcode
              - property_category
              - property_creation_date
              - property_access_date
        - name: ascending
          in: query
          description: |-
            Specifies the direction of the sort order.

            * ascending=true: results in an ascending sort order (from small to large (A-Z) and from old to young).
            * ascending=false: results in an descending sort order (from large to small (Z-A) and from young to old).

            If the ascending parameter is not explicitly specified, the ascending sort order is
            applied. This is not true for the default sort order: If the Last modified criteria
            is used for sorting and the sort order is not specified, the sort order will be
            descending.

            In addition to this, dossiers are displayed prior to documents in the result list.
            Within documents and dossiers, the items are sorted by the specified sorting
            criterion.
          schema:
            type: boolean
        - name: children_of
          in: query
          schema:
            type: string
          description: |-
            Specifies the document ID for which the linked direct child items are searched.

      responses:
        "200":
          description: OK
          content:
            text/html:
              schema: {}

  /r/{repositoryId}/sf/{searchFilterId}/sr:
    get:
      summary: Display the search results for a stored search filter
      description: |-
        Behaves like /r/{repositoryId}/sr, except that the search criteria (full text,
        properties, object definition IDs) are not passed as query parameters but taken
        from the referenced search filter.
      tags:
        - Dialogs
      operationId: getSearchResultsDialogForSearchFilter
      parameters:
        - $ref: "#/components/parameters/repositoryId"
        - $ref: "#/components/parameters/searchFilterId"
        - name: page
          in: query
          schema:
            type: string
        - name: pagesize
          in: query
          schema:
            type: string
        - name: propertysort
          in: query
          schema:
            type: string
        - name: ascending
          in: query
          schema:
            type: boolean
        - name: layoutid
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema: {}

  /r/{repositoryId}/o2:
    get:
      tags:
        - Dialogs
      summary: Displaying multiple DMS objects in the MultiPreview
      description: |-
        This resource redirects (302) to the MultiPreview page of the View app, which displays the DMS
        objects contained in the selection list referenced by the multiPreviewSelectionListUrl query
        parameter.

        The multiPreviewSelectionListUrl is filled in one of the following ways:

        * When the resource is called from the context menu of a search result list, the URL points to
          the createSelection resource (/r/{repositoryId}/sel/{id}) that was created for the current
          search result. The selected items are written to this resource beforehand via a PUT request.
        * An app can provide its own relative URL. DMSApp performs an anonymous, unauthenticated HTTP GET
          request against this URL and expects a JSON response body according to the SelectionList
          schema. If access to the URL needs to be restricted, the URL itself must act as a capability
          (for example by containing an unguessable ID), since no bearer token or session information
          is forwarded.

          Example: for the query parameter
          multiPreviewSelectionListUrl=%2Fmyapp%2Fmy-selections%2F3fa85f64-5717-4562-b3fc-2c963f66afa6,
          DMSApp performs `GET /myapp/my-selections/3fa85f64-5717-4562-b3fc-2c963f66afa6` and expects a
          response such as:

          ```json
          {
            "selectionList": [
              { "id": "D000000123", "caption": "Invoice 2024-001" },
              { "id": "D000000456", "caption": "Invoice 2024-002" }
            ]
          }
          ```

          The request to this URL times out after 30 seconds and the response must not exceed 10MB.
          The response must also include a Content-Length header; responses without one (for example
          when using chunked transfer encoding) are rejected regardless of their actual size.
      operationId: getDmsObjectsMultiPreview
      parameters:
        - $ref: "#/components/parameters/repositoryId"
        - $ref: "#/components/parameters/multiPreviewSelectionListUrl"
      responses:
        "302":
          description: |-
            Redirects to the MultiPreview page of the View app displaying the requested DMS objects.

            The client-side viewer additionally supports navigating to a specific page via the URL fragment
            (e.g. `#page=3`). This is handled entirely in the browser and is not processed by the server.
            The navigation to the given page only happens once, when the MultiPreview is initially opened,
            and only applies to the first document of the MultiPreview.
          headers:
            Location:
              schema:
                type: string
                description: The URL of the MultiPreview page in the View app.
        "400":
          description: Bad request. Detailed error information provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPageModel"
        "404":
          description: The selection list referenced by multiPreviewSelectionListUrl was not found or is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPageModel"

  /r/{repositoryId}/o2/{dmsObjectId}/preview:
    get:
      tags:
        - Dialogs
      summary: Displaying the preview of a DMS object
      description: |-
        The View perspective offers you a preview for the selected item. You can use the content of the
        perspective for an item directly without loading the other perspectives.
      operationId: getDmsObjectPreviewDialog
      parameters:
        - $ref: "#/components/parameters/repositoryId"
        - $ref: "#/components/parameters/mappingDmsObjectId"
        - $ref: "#/components/parameters/isReadonly"
      responses:
        "200":
          description: |-
            The response body contains the HTML code for the preview of the DMS object.
            The preview is displayed in the browser.

  /r/{repositoryId}/sf:
    post:
      tags:
        - Search Filters
      summary: Create a search filter
      description: |-
        Stores a new search filter for the given repository. The ID of the search filter is
        generated by the DMSApp and is not derived from the request body.

        If the call is successful, the URL of the created search filter is returned in the
        Location header. The response body contains the same search filter, additionally
        enriched with a searchResult link relation that you can use to retrieve the results
        matching the search filter.
      operationId: addSearchFilter
      parameters:
        - $ref: "#/components/parameters/repositoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchFilter"
            examples:
              SearchFilter:
                value:
                  {
                    "timeToLive": 3600,
                    "value":
                      {
                        "fulltext": "invoice",
                        "objectDefinitionIds": ["RECH"],
                        "properties": { "myprop1_ID": ["Test e-mail 1"] },
                        "sortId": "property_last_modified_date",
                        "sortAscending": false,
                      },
                  }
              SearchFilterWithDocIds:
                value:
                  {
                    "timeToLive": 3600,
                    "value":
                      {
                        "properties":
                          {
                            "property_document_id":
                              [
                                "WH00023865",
                                "WH00020633",
                                "WH00021767",
                                "WH00016716",
                                "WH00021723",
                                "WH00019419",
                                "WH00020765",
                                "WH00020641",
                                "WH00020636",
                              ],
                          },
                      },
                  }
      responses:
        "201":
          description: CREATED
          headers:
            Location:
              schema:
                type: string
              description: The URL of the newly created search filter. Save this URL to update or delete the search filter later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchFilter"
        "400":
          description: Bad request. The request body is invalid or cannot be parsed.
        "500":
          description: The request body could not be parsed.

  /r/{repositoryId}/sf/{searchFilterId}:
    get:
      tags:
        - Search Filters
      summary: Retrieve a search filter
      description: |-
        Retrieves the details of a previously stored search filter by its ID.
        The response includes the filter criteria and link relations for 
        executing the search.
      operationId: getSearchFilter
      parameters:
        - $ref: "#/components/parameters/repositoryId"
        - $ref: "#/components/parameters/searchFilterId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchFilter"
        "404":
          description: No search filter was found for the given ID.

    put:
      tags:
        - Search Filters
      summary: Update a search filter
      description: |-
        Updates an existing search filter with new criteria. The search filter ID 
        cannot be changed.
      operationId: updateSearchFilter
      parameters:
        - $ref: "#/components/parameters/repositoryId"
        - $ref: "#/components/parameters/searchFilterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchFilter"
      responses:
        "204":
          description: No Content. The search filter was updated successfully.
        "400":
          description: Bad request. The request body could not be parsed.
        "404":
          description: No search filter was found for the given ID.

    delete:
      tags:
        - Search Filters
      summary: Delete a search filter
      description: |-
        Deletes an existing search filter with the given ID.
      operationId: deleteSearchFilter
      parameters:
        - $ref: "#/components/parameters/repositoryId"
        - $ref: "#/components/parameters/searchFilterId"
      responses:
        "200":
          description: The search filter was deleted successfully.
        "404":
          description: No search filter was found for the given ID.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        The app d.ecs identity provider is responsible for authentication. Almost all the REST
        resources of the DMSApp must be called with authentication. In the following descriptions
        of the API functions, you are informed if you can call a REST resource anonymously.

        For information about how the identity provider app works, see the identity provider API
        documentation.
  schemas:
    Culture:
      type: string
      enum:
