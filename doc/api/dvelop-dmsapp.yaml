    ExtensionPropertyId:
      type: string
      description: |-
        * repository.id
          ID of the repository as specified in the d.ecs repo app.
        * user.d3.group_id
          * Activation condition: ID of a d.3 user group (maximum of eight characters) of which the
            user that is currently logged in is a member.
          * Placeholder uriTemplate: List of IDs of the d.3 user groups (each a maximum of eight
            characters) of which the user currently logged in is a member as an array in JSON format.
        * user.idp.group_id
          * Activation condition: GUID of an identity provider app user group of which the user that
            is currently logged in is a member.
          * Placeholder uriTemplate: List of GUIDs of the identity provider app user groups of which
            the user currently logged in is a member as an array in JSON format.
        * dmsobject.property_editor
          Editor of the item.
        * dmsobject.property_owner
          Owner of the item.
        * dmsobject.property_filename
          File name for the item.
        * dmsobject.property_filetype
          File type for the item.
        * dmsobject.property_document_number
          Document number of the item.
        * dmsobject.property_creation_date
          Creation date of the item.
        * dmsobject.property_size
          File size of the item.
        * dmsobject.property_state
          Document status of the item.
          Possible values:
          * Archived: The element has the Archive status.
          * VerificationInProgress: The element has the Verification status.
          * Processing: The element has the Processing status.
          * Released: The element has the Released status.
        * dmsobject.property_variant_number
          Variant number of the item.
        * dmsobject.property_access_date
          Access date for the item.
        * dmsobject.property_remark
          Remarks about the item.
        * dmsobject.property_last_alteration_date
          Alteration date of the item.
        * dmsobject.property_caption
          Title for the item.
        * dmsobject.property_category
          Item category ID.
        * dmsobject.property_category_uuid
          UUID of the item category.
        * dmsobject.property_colorcode
          Color marking for the item.
        * dmsobject.property_document_class
          * Activation condition: A document class abbreviation for the item.
          * Placeholder uriTemplate: List of document class IDs for the item as an array in JSON format.
        * dmsobject.property_document_id
          Document ID of the item.
        * dmsobject.property_display_version_id
          Unique ID for the display version for the DMSApp.
        * dmsobject.type
          The item type.
          Possible values:
          * Document: The item is an item of the "Document" type.
          * Dossier: The item is an item of the "Dossier" type.
        * dmsobject.{NUMBER|UUID}
          For the {NUMBER|UUID} placeholder, enter the advanced property ID or UUID as it is defined
          in the d.3 repository. If the d.3 property is a multi-value property, the placeholder will be
          replaced by the first or the first filled value of the property (depending on the d.3 repository
          configuration). If there are multiple values for the multi-value property, three dots (...) are
          added to the value returned.
        * dmsobject.fieldposition.{NUMBER}
          For the {NUMBER} placeholder, enter the database position of the advanced property.
          We strongly recommend using the advanced property ID (dmsobject.{NUMBER}). Use the database position
          only in exceptional cases when the advanced property ID is not available to you or can only be
          determined in a very time-consuming process. If the d.3 property is a multi-value property, the
          placeholder will be replaced by the first or the first filled value of the property (depending on the
          d.3 repository configuration). If there are multiple values for the multi-value property, three dots
          (...) are added to the value returned.
      enum:
        - "repository.id"
        - "user.idp.group_id"
        - "user.d3.group_id"
        - "dmsobject.self_url_relative"
        - "dmsobject.property_editor"
        - "dmsobject.property_owner"
        - "dmsobject.property_filename"
        - "dmsobject.property_filetype"
        - "dmsobject.property_document_number"
        - "dmsobject.property_creation_date"
        - "dmsobject.property_size"
        - "dmsobject.property_state"
        - "dmsobject.property_variant_number"
        - "dmsobject.property_access_date"
        - "dmsobject.property_remark"
        - "dmsobject.property_last_alteration_date"
        - "dmsobject.property_caption"
        - "dmsobject.property_category"
        - "dmsobject.property_category_uuid"
        - "dmsobject.property_colorcode"
        - "dmsobject.property_document_class"
        - "dmsobject.property_document_id"
        - "dmsobject.property_display_version_id"
        - "dmsobject.property_version_id"
        - "dmsobject.type"
        - "dmsobject.{NUMBER|UUID}"
        - "dmsobject.fieldposition.{NUMBER}"
        - "dmsobject.doc_permission.{KEY}"
        - "dmsobject.mainblob.content_type"
        - "dmsobject.mainblob.content_url"
        - "dmsobject.mainblob.content_url_relative"
        - "dmsobject.mainblob.id"
        - "dmsobject.dependentblobs"
        - "dmsobject.dependentblob.{ID}.content_url"
        - "dmsobject.dependentblob.{ID}.content_url_relative"

    ExtensionListPropertyId:
      type: string
      description: |-
        * repository.id
          ID of the repository as specified in the d.ecs repo app.
        * user.d3.group_id
          * Activation condition: ID of a d.3 user group (maximum of eight characters) of which the
            user that is currently logged in is a member.
          * Placeholder uriTemplate: List of IDs of the d.3 user groups (each a maximum of eight
            characters) of which the user currently logged in is a member as an array in JSON format.
        * user.idp.group_id
          * Activation condition: GUID of an identity provider app user group of which the user that
            is currently logged in is a member.
          * Placeholder uriTemplate: List of GUIDs of the identity provider app user groups of which
            the user currently logged in is a member as an array in JSON format.
        * dmsobjectlist.url
          A URL-encoded URL under which the list of items selected by the user (documents and dossiers) can be
          queried. As an HTTP response, you receive this URL as a selectionList JSON array that returns the following
          information for each item:
          * _links.self.href: Relative URL for the item that you can use to retrieve more detailed information about the item.
          * id: Document ID of the item.
          * caption: Title for the item.

          Example:

          ```json
          selectionList
          {
            "selectionList":
            [{
                "_links": {
                "self": {
                "href": "/dms/r/e632f767-5cfa-538dab55-
                6756c36a74c9/o2/A0000000001"
              }
              },
                "id": "A0000000001",
                "caption": "Title of the item"
              }
            ]
          }
          ```
      enum:
        - "repository.id"
        - "user.idp.group_id"
        - "user.d3.group_id"
        - "dmsobjectlist.url"

    Severity:
      type: number
      description: |-
        Error severity

        - Success (0)
        - Information (1)
        - Warning (2)
        - Error (3)
      enum:
        - 0
        - 1
        - 2
        - 3

    Href:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean

    Repository:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    ObjDef:
      type: object
      properties:
        id:
          type: string
        uniqueId:
          type: string
        displayName:
          type: string
        writeAccess:
          type: boolean
        objectType:
          type: number
          enum: [0, 1]
          description: >
            0 = Document, 1 = Dossier
        propertyFields:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              uniqueId:
                type: string
              docFieldId:
                type: number
              displayName:
                type: string
              dataType:
                type: number
                enum: [0, 1, 2, 3, 4, 5]
                description: >
                  0 = Alphanumeric, 1 = Double/Numeric, 2 = Money/Currency, 3 = Datetime, 4 = Date, 5 = Key-/value pair
              isList:
                type: boolean
                description: Indicates if the property is a multi-value property
        count:
          type: number

    Extension:
      type: object
      required:
        - id
        - context
        - uriTemplate
      properties:
        id:
          description: |-
            Specifies the unique technical name used to differentiate the extension from other extensions.
          type: string
        activationConditions:
          description: |-
            For each extension, the application notifies you of which activation conditions are used to
            display the context action. These activation conditions are reported by the application in
            advance. If the activation conditions were not reported in advance, DMSApp would have to query
            other apps with a network request at a later time when the user is viewing an item. The waiting
            time for the user would then increase significantly if an app only responds to this request
            with a delay.

            A context action is displayed if all the sub-conditions are met. If the list of activation
            conditions does not contain an entry, the extension is generally active.

            You specify the activation conditions as an array.
          type: array
          items:
            type: object
            required:
              - propertyId
              - operator
              - values
            properties:
              propertyId:
                description: |-
                  Specifies the ID of the property that is tested for the activation condition.
                $ref: "#/components/schemas/ExtensionPropertyId"
              operator:
                description: |-
                  The operator specifies how a sub-condition is evaluated. The following operator is
                  available:
                    * or: An or condition is fulfilled if the current value of the property corresponds
                      to one of the values. Capitalization is not taken into account.
                    * notOr: A notOr condition is fulfilled if the current value of the property does
                      not correspond to any of the values. Capitalization is not taken into account.
                type: string
                enum:
                  - or
                  - notOr
              values:
                type: array
                items:
                  type: string
        captions:
          description: |-
            Each context action notifies you of the name under which it is displayed. You can also
            include different languages. In this case, the language-dependent names are specified
            as an array. To ensure the language packages are fully compatible, specify the languages
            for the following Cultures names:
              * cs (Czech)
              * da (Danish)
              * de (German)
              * en (English)
              * es (Spanish)
              * fr (French)
              * hr (Croatian)
              * it (Italian)
              * nl (Dutch)
              * pl (Polish)
              * sr (Serbian)
              * sk (Slovakian)
              * zh-CN (Chinese (simplified))

            If the user requests a language for which the extension app does not have any
            specification for the localized (language-specific) name, an alternative language
            is determined for the view based on the following rules:

            If the language ID with the regional code (e.g. en-GB) is not found, the system checks
            whether the higher-level language without the regional code is available (en). In the
            example above, "Export List" is displayed for a request of the "en-GB" language because
            "en" is used as an alternative. If the higher-level language is also unavailable,
            English "en" without the regional code is always used as the alternative. If "en" is also
            not specified as the alternative, the first specified language is displayed as the
            alternative.
          type: array
          items:
            type: object
            required:
              - culture
              - caption
            properties:
              culture:
                $ref: "#/components/schemas/Culture"
              caption:
                type: string
        descriptions:
          description: |-
            (Optional) Each context action can indicate which description is displayed for that
            context action. This description is displayed as a tooltip for the context action.
            Different languages are specified as in the captions property.
          type: array
          items:
            type: object
            required:
              - culture
              - description
            properties:
              culture:
                $ref: "#/components/schemas/Culture"
              description:
                type: string
        context:
          type: string
          enum:
            - DmsObjectDetailsContextAction
            - DmsObjectDetailsPreview
            - DmsObjectListContextAction
        uriTemplate:
          description: |-
            Defines the URL that you want to be called when the user has completed the selection.
            You can define placeholders to receive more information about the current context.
            The placeholders are replaced by the actual properties when the extension is called.

            The properties are specified in curly brackets. Example: /myapp/dosomething?id={dmsobject.property_document_id}
          $ref: "#/components/schemas/ExtensionPropertyId"
        iconUri:
          type: string
          description: |-
            Specifies the link to the icon that is displayed for the context action. The icon file must be available in SVG format.
            The color of the SVG's fill must not be specified, so that the fill color can be adjusted by using the theming.
        target:
          type: string
          enum:
            - dapi_navigate
            - dapi_inner_supply
            - dapi_outer_supply
            - _blank
          description: |-
            Specifies where the content of the context action should be displayed.
            Possible values:
              * dapi_navigate (default value): Navigates to a new main resource with the content within the Shell app.
              * dapi_inner_supply: Opens an Inner Supply (display area below the app bar) with the content.
              * dapi_outer_supply: Opens an outer supply (display area above the app bar) with the content.
              * _blank: Opens a new tab in the browser with the content.
        options:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                enum: ["group"]
              value:
                type: string
                enum:
                  [
                    "open",
                    "new",
                    "download",
                    "share",
                    "ai",
                    "edit",
                    "processes",
                    "link",
                    "delete",
                    "other",
                  ]
          description: |-
            Specifies additional options for the context action.
            Possible keys:
               * `group`: [Feature preview] Defines in which group of the context action structure this context action should be visible.
                 This key is not allowed if context is set to DmsObjectDetailsPreview. Possible values for this key:
                    * `open`: When the element itself or another element-related view is opened.
                    * `new`: When the element is replaced or a new element is created.
                    * `download`: When the element is downloaded from the system.
                    * `share`: When the element is shared digitally.
                    * `ai`: When the element is used or processed with ai.
                    * `edit`: When the element or its properties are changed.
                    * `processes`: When a process or operation is executed on the element.
                    * `link`: When the element is linked to other elements.
                    * `delete`: When the element is removed from the system.
                    * `other` (default value): All other actions.

    SourceSystem:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
        displayName:
          type: string
        categories:
          type: array
          items:
            type: object
            required:
              - key
              - displayName
            properties:
              key:
                type: string
              displayName:
                type: string
        properties:
          type: array
          items:
            type: object
            required:
              - key
              - displayName
            properties:
              key:
                type: string
              displayName:
                type: string

    DefaultSourceSystem:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
        displayName:
          type: string
        categories:
          type: array
          items:
            type: object
            required:
              - key
              - displayName
            properties:
              key:
                type: string
              displayName:
                type: string
        properties:
          type: array
          items:
            type: object
            required:
