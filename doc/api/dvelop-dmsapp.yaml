openapi: 3.1.0
info:
  version: 1.0.0
  title: d.velop DMSApp
  description: |-
    # Introduction
    This topic provides you with general information about the DMSApp OpenAPI, its scope of functions
    and useful information to know when programming functions and customizations.

    ## About the DMSApp API

    In this documentation, you can learn how to use the programming interface of DMSApp for your own
    developments.

    This documentation is designed for developers of applications that are to be run in the d.ecs architecture
    system environment. DMSApp is a core component in the d.ecs architecture system environment and provides
    functions related to documents and dossiers within the framework of a d.3ecm system.

    JSON objects, URLs, and query parameters can be enhanced at any time while the API is still valid. Only the
    extension points, properties, objects and parameters for API programming described in this documentation
    are released. Each chapter indicates whether the URL for retrieving the HTML page, the JSON representation
    or the extension point is released. The HTML page is used exclusively for UI integration, must not be
    evaluated with programs and may be changed at any time without prior notification. Any properties that are
    not described in this documentation are not permitted for use.

    This documentation is available to development partners of d.velop AG online on the Service Portal. Passing
    this documentation or parts of it on to third parties is not permitted. For requests as part of the
    development partnership, only the online documentation applies.

    Please note that your software accesses data stored and configured in d.3ecm by your customers via this
    interface and also affects the procedures in the d.3ecm system. Please handle it with care and make sure
    that your application is part of an existing collaboration of several applications. The improper use of
    this interface may lead to changed application procedures and the loss of data.

    ## Scope of functions of DMSApp

    DMSApp is the core HTTP interface to essential functionality related to documents and dossiers in the
    d.3ecm environment. You can use the DMS app, for example, to create mappings, create, edit and update
    documents. You can also navigate through dossier structures and display detailed information using the
    DMS app. In addition, the DMS API offers lots of extension points for your own features and functions.

    ## Prerequisites

    This documentation is designed for administrators of a d.3ecm system and for developers creating apps
    and extensions.

    You should be familiar with the following subjects to use the API:

    * You should have a good knowledge of the d.3ecm architecture.
    * You should be familiar with the authentication using the d.ecs identity provider API in the d.3ecm
      context.
    * You should have knowledge in the development of web-based apps and be confident in dealing with
      following detailed topics:

      * OpenApi
      * RESTful HTTP interfaces
      * JavaScript Object Notation JSON) (RFC 7159)
      * Hypertext Application Language in connection with the JavaScript Object Notation (HAL+JSON)
      * UriTemplate (RFC 6570)

    * If you want to provide your own user interface, you should be familiar with HTML, CSS and responsive
      web design. To facilitate a consistent look & feel, it is recommended to know how to use the
      framework Material Design. For more recommendations about how to design see the Developer Portal.
    * Additionally, knowledge in administering a web server is a benefit.

    # Notes about support for API programming

    Please note that your software accesses stored and configured data in d.3ecm owned by your customers
    via this interface and also affects the procedures in the d.3ecm system. Please handle it with care
    and make sure that your application is part of an existing collaboration of several applications.
    The improper use of this interface can lead to changed application procedures and the loss of data.

    Software developments with this programming interface are individual developments. The program
    code generated by you is not subject to the maintenance and support conditions of the products
    of d.velop AG. Our support will be pleased to help you, but your requests are subject to
    additional charges, if it is not lead back to an error in our products.

      For any questions about the prerequisites and the software development with d.3ecm, please
      contact the Technology Partners Management of d.velop AG.

    ## Overview of formats for errors
    In this chapter, you will learn more about the basics of error handling and the format in which
    errors are returned. Depending on the result of the processing of an HTTP request, the request
    is answered with different HTTP status codes. Descriptive information can be returned as
    JSON as an option.
    Example for a response upon a failed request:
    ```
    HTTP/1.1 400 BadRequest
    {
        "reason": "10019: Missing value for a mandatory property.",
        "severity": 1,
    }
    ```
    Description of parameters for response upon a failed request:

    | Property | Description                                                                                                               |
    | :------- | :-------------------------------------------------------------------------------------------------------------------------|
    | reason   | An optional short description of why the error has occurred. This text is used as the error message’s title.              |
    | hint     | An optional message for the user containing troubleshooting tips.                                                         |
    | details  | Optional detailed information about the error.                                                                            |
    | severity | Optional error severity. Possible values are: <br><code>Success = 0<br>Information = 1<br>Warning = 2<br>Error = 3</code> |


    # Technical background information

    ## Basic knowledge about authentication

    The app d.ecs identity provider is responsible for authentication in the architecture of a d.3ecm environment. Almost all
    the REST resources of the DMSApp must be called with authentication. In the following descriptions of the API functions,
    you are informed if you can call a REST resource anonymously.

    For information about how the identity provider app works, see the identity provider API documentation.

    ## Basic information about write access

    When calling the API via the HTTP verbs *POST*, *PUT*, *DELETE* and *PATCH*, you must specify the Origin header. The header
    value must correspond to the calling URL without path. The header is not required for read access (e.g. GET).

    It is necessary to specify a value for Origin in order to prevent CSRF (Cross-Site Request Forgery) attacks.

    Request:
    ```
    PUT /dms/sampleuri
    Origin: https://samplehost
    ```

    If the header is missing, the DMSApp will reply with HTTP 403 Forbidden.

    ## Basic information about limitations (only applies to the d.velop documents cloud offer):

    * max. 600 updates of DMS objects per tenant (x-dv-tenant-id) in a period of 1 minute
    * max. 1600 saves of new DMS objects per tenant (x-dv-tenant-id) in a period of 1 minute

    If this limit is exceeded, the DMSApp will reply with HTTP 429 Too Many Requests.
  contact:
    name: d.velop AG
    email: support@d-velop.de
servers:
  - url: https://{systemBaseUri}/dms
    description: dms endpoint
    variables:
      systemBaseUri:
        description: Your system base uri (e.g. myserver.com,  my-tenant.d-velop.cloud)
        default: "my-tenant.d-velop.cloud"

security:
  - bearerAuth: []

tags:
  - name: "Repositories"
  - name: "DmsObjects"
  - name: "Extensions"
  - name: "Mappings & Sources"
    description: |-
      Apps often find themself in a scenario where they need to interact with various repositories across different tenants. Each tenant may have its own categories and properties, making direct communication between the app and tenant repositories difficult to standardize.

      To resolve this, d.velop provides a **Mapping** mechanism. This allows the app to define a **source** (containing expected categories and properties), which tenant administrators can then **map** to their local repository structures.

      This avoids the need for apps to query and store each tenant's repository configuration, enabling a scalable and maintainable approach for multi-tenant integration.

      ## How It Works
      1. **App defines a source**: The App creates a source via the API, defining its expected categories and properties.
      2. **Tenant Admin maps to local repository**: In each tenant, an administrator uses the d.velop mapping interface to link the app’s categories/properties to their tenant-specific ones.
      3. **Runtime Translation**: When the app interacts with the DMS-App, it can set a `sourceId`-parameter. DMS-App translates the source categories/properties to the mapped tenant equivalents.

      The default mapping (which means the real repository structure) is always `/dms/r/{repoId}/source`.

      ## Example

      1. An app handling delivery notes might want to create a source like:

          `POST /dms/r/source` (see [Create a mapping source](#/paths/~1mapping~1sources/post))
          ```json
          {
            "sourceId": "/cool-supplier-app/sources/delivery-notes",
            "categories": [
              {
                "key": "deliveryNote",
                "displayName": "Delivery Note"
              }
            ],
            "properties": [
              {
                "key": "deliveryNoteNumber",
                "displayName": "Delivery Note Number"
              },
              {
                "key": "supplierId",
                "displayName": "Supplier No."
              }
            ]
          }


      2. A tenant admin will map the sources categories and properties to those of the repository
          - Source category `deliveryNote` → repository category `Lieferscheine`
          - Source property `deliveryNoteNumber` → repository property `No.`
          - Source property `supplierId` → repository property `Lieferantennummer`

      3. API-Calls will now get translates at runtime

          `GET /dms/r/{repoId}/o2m/some-dms-object?sourceId=%2Fcool-supplier-app%2Fsources%2Fdelivery-notes`
          ```json
          {
            "id": "some-dms-object",
            "sourceProperties": [
              {
                "key": "deliveryNoteNumber",
                "value": "48529321"
              },
              {
                "key": "supplierId",
                "value": "8562851"
                  },
              ...
            ],
            "sourceCategories": [
              "deliveryNote"
            ],
            "_links": {...},
            "_embedded": {...}
          }
  - name: "Search Filters"
    description: |-
      A search filter stores the criteria of a search operation (full-text term, categories,
      properties and sort order) under a generated ID for a limited amount of time. Once stored,
      the search filter can be resolved again via its searchResult link relation to retrieve the
      matching search results, without the caller having to resend all the search criteria.
  - name: "Dialogs"

paths:
  /r:
    get:
      tags:
        - Repositories
      summary: Get all repositoriers
      description: |-
        To implement your own functions, you always need the ID of the repository. With DMSApp,
        you have the option of accessing different repositories if you have configured multiple
        repositories in your company or organization.

        If, for example, you want to start a search, you must first select a repository. The repository
        ID is required for this. The repository ID is a unique identifier for a repository in the
        d.3ecm system. You can find the repository ID in the d.3ecm administration interface.
      operationId: getAllRepositories
      parameters: []
      responses:
        "200":
          description: OK
          content:
            application/hal+json:
              schema:
                type: object
                properties:
                  repositories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repository"
              examples:
                Repositories:
                  description: |-
                    In the response, you receive an array of repositories in which the repository
                    ID is listed as the id property and the repository's display name is
                    listed as the name property.
                  value:
                    {
                      repositories:
                        [
                          {
                            id: "dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27",
                            name: "Contoso (A)",
                          },
                          {
                            id: "39b68b01-0428-5049-8d80-c8c0750ba885",
                            name: "Contoso (B)",
                          },
                        ],
                    }
  /r/{repositoryId}:
    get:
      tags:
        - Repositories
      summary: Get a repository
      operationId: getRepository
      parameters:
        - $ref: "#/components/parameters/repositoryId"
      responses:
        "200":
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/Repository"
              examples:
                Repositories:
                  description: |-
                    The JSON object in the response is the same object as the object in the
                    list of JSON objects from the request for the URL /r
                  value:
                    {
                      id: "dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27",
                      name: "Contoso (A)",
                    }
  /r/{repositoryId}/objdef:
    get:
      tags:
        - Repositories
      summary: Get the object definitions of a repository
      operationId: getDmsObjectDefinitions
      parameters:
        - $ref: "#/components/parameters/repositoryId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  objectDefinitions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ObjDef"
                  count:
                    type: number
              examples:
                ObjDef:
                  value:
                    {
                      objectDefinitions:
                        [
                          {
                            id: "5",
                            uniqueId: "d42018fc-ab90-4ca5-807c-5259152fd3ab",
                            displayName: "Sample category1",
                            writeAccess: true,
                            objectType: 0,
                            propertyFields:
                              [
                                {
                                  id: "10044",
                                  uniqueId: "1ac35664-e204-4bee-8aee-378abbae78ae",
                                  docFieldId: 38,
                                  displayName: "Sample property1",
                                  dataType: 0,
                                },
                              ],
                          },
                        ],
                      count: 1,
                    }

  /extensions:
    get:
      tags:
        - Extensions
      summary: Get extensions
      description: |-
        Open HTML that shows all installed extensions
      operationId: getExtension
      parameters:
        - name: extensionId
          in: query
          required: false
          description: |-
            The ID of an extension. If you provide an ID, the HTML page will only show this extension.
          schema:
            type: string
      responses:
        "200":
          description: OK
    post:
      tags:
        - Extensions
      summary: Add a new extension to the dmsapp
      description: |-
        Extension points allow you to enhance the DMSApp with your own functions. The DMSApp provides extension points at
        the following positions:

        * Replacing the content of the "View" perspective in the detail view
        * Adding context actions to lists
        * Adding context actions to detail view

        A context action can be created via HTTP POST request for the URL /dms/extensions in the DMSApp. The request must be
        made by a user with administration rights or by an app, using appsessions. If the
        request response is successful, the extension is stored in the DMSApp and you get
        a location URL in the response header. Via the location URL, a user with
        administration rights or an app, can also delete the extension in the DMSApp.
        To do this, an HTTP DELETE request must be sent to the Location URL value.
      operationId: addExtension
      requestBody:
        description: The extension to add as a json object
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Extension"
            examples:
              DmsObjectDetailsContextAction:
                summary: Adding context actions to detail view
                description: |-
                  You can add context actions to the detail view for an item (DMS object, document or dossier).
                  These context actions are also summarized in the menu for context actions (three stacked dots)
                  for an item. The app that you want to provide such an extension must return an HTTP response
                  in JSON format under the link relation dmsobjectextensions. The response must provide
                  the following information for each context action:

                   *  Extension point context: DmsObjectDetailsContextAction
                   *  Activation condition for displaying the context action.
                   *  Display name for the context action in the available translations.
                   *  Link to the context action icon.
                   *  The action to be performed once the user has clicked on the context action. Specify a
                      relative link that is called from DMSApp using HTTP GET.
                value:
                  {
                    "id": "myapp.openExternalApp",
                    "activationConditions":
                      [
                        {
                          "propertyId": "repository.id",
                          "operator": "or",
                          "values": ["e632f767-5cfa-538d-ab55-6756c36a74c9"],
                        },
                      ],
                    "captions":
                      [
                        {
                          "culture": "de",
                          "caption": "Externe Applikation öffnen",
                        },
                        {
                          "culture": "en",
                          "caption": "Open external application",
                        },
                      ],
                    "context": "DmsObjectDetailsContextAction",
                    "uriTemplate": "/myapp/dosomething?id={dmsobject.property_document_id}",
                    "iconUri": "/myapp/images/goto.svg",
                    "target": "dapi_navigate",
                    "options": [{ "key": "group", "value": "open" }],
                  }

              DmsObjectListContextAction:
                summary: Adding context actions to lists
                description: |-
                  If you add context actions to lists with items (e.g. documents and dossiers), they are
                  displayed in the following sections:

                  * Results in the Search feature
                  * Content of a dossier
                  * Your lists of favorites and watched items in the Personal Area feature

                  If the user clicks a context action in a list, the list always first switches to
                  selection mode. In selection mode, the user can select the desired items and execute the
                  context action.

                  The app that you want to provide such extensions must return an HTTP response in JSON format
                  under the dmsobjectextensions link relation. This response must provide the following
                  information for each context action:

                  * Extension point context: DmsObjectListContextAction
                  * Activation condition for displaying the context action.
                  * Display name for the context action in the available translations.
                  * Link to the context action icon.
                  * The action to be performed once the user has completed the selection. Specify a relative
                    link that is called from DMSApp using HTTP GET.
                value:
                  {
                    "id": "myapp.exportList",
                    "activationConditions":
                      [
                        {
                          "propertyId": "repository.id",
                          "operator": "or",
                          "values": ["e632f767-5cfa-538d-ab55-6756c36a74c9"],
                        },
                      ],
                    "captions":
                      [
                        { "culture": "de", "caption": "Exportieren" },
                        { "culture": "en", "caption": "Export" },
                        {
                          "culture": "en-GB",
                          "caption": "Exportin Great Britain",
                        },
                      ],
                    "descriptions":
                      [
                        {
                          "culture": "de",
                          "description": "Liste als CSV exportieren",
                        },
                        {
                          "culture": "en",
                          "description": "Export list as CSV",
                        },
                        {
                          "culture": "en-GB",
                          "description": "Export list as CSV in Great Britain",
                        },
                      ],
                    "context": "DmsObjectListContextAction",
                    "uriTemplate": "/myapp/dosomething?url={dmsobjectlist.url}",
                    "iconUri": "/myapp/images/export-list.svg",
                    "target": "dapi_navigate",
                    "options": [{ "key": "group", "value": "download" }],
                  }
              DmsObjectDetailsPreview:
                summary: Replacing the content of the "View" perspective in the detail view
                description: |-
                  You can replace the content of the View perspective for the detail view for an
                  item (e.g. a document or dossier) so that you can display your own preview
                  under certain conditions.

                  The app that you want to provide such an extension must return an HTTP response
                  in JSON format under the dmsobjectextensions link relation. This response must
                  provide the following information for each extension point of the View
                  perspective:

                  * Extension point context: DmsObjectDetailsPreview
                  * Activation condition for displaying your preview.
                  * The URL for the preview that you want to display when the user opens the
                    View perspective in the detail view and meets your predefined activation
                    conditions. Specify a relative link that is called from DMSApp using
                    HTTP GET.
                value:
                  {
                    "id": "myapp.viewer",
                    "activationConditions":
                      [
                        {
                          "propertyId": "dmsobject.mainblob.content_type",
                          "operator": "or",
                          "values": ["text/plain", "application/pdf"],
                        },
                      ],
                    "context": "DmsObjectDetailsPreview",
                    "uriTemplate": "/myapp/preview?layer0={dmsobject.mainblob.content_url}",
                  }
      responses:
        "201":
          description: CREATED
          headers:
            Location:
              schema:
                type: string
              description: The URL of the newly created resource. Save this URL to delete the extension later.
    delete:
      summary: Delete an extension
      description: |-
        You can delete an extension as a user with administration rights or as an app. The url corresponds to
        the location URL which was returned when the extension was created.
      tags:
        - Extensions
      operationId: deleteExtension
      parameters:
        - name: extensionId
          in: query
          required: true
          description: The ID of the extension
          schema:
            type: string
      responses:
        "200":
          description: OK

  /extensions/{extensionId}:
    delete:
      summary: Delete an extension
      description: |-
        You can delete an extension as a user with administration rights or as an app. The url corresponds to
        the location URL which was returned when the extension was created.
      tags:
        - Extensions
      operationId: deleteExtensionDeprecated
      parameters:
        - name: extensionId
          in: path
          required: true
          description: The ID of the extension, can not contain slashes
          schema:
            type: string
      responses:
        "200":
          description: OK

  /mapping/source:
    post:
      summary: Creates a mapping source
      description: |-
        You can create a mapping source as a user with administration rights or as an app.
      tags:
        - Mappings & Sources
      operationId: addMappingSource
      requestBody:
        description: The source to add as a json object
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSystem"
            examples:
              SampleSourceJson:
                value:
                  {
                    "id": "/myapp/sources/mysource",
                    "displayName": "My Source",
                    "properties":
                      [
                        {
                          "key": "myprop1_ID",
                          "displayName": "Sample property1",
                        },
                      ],
                    "categories":
                      [
                        {
                          "key": "mycategory1_ID",
                          "displayName": "Sample category1",
                        },
                      ],
                  }
      responses:
        "201":
          description: CREATED
          headers:
            Location:
              schema:
                type: string
              description: The URL of the newly created resource. Save this URL to delete the extension later.
    put:
      summary: Updates a mapping source
      description: |-
        You can update a mapping source as a user with administration rights or as an app. The url
        corresponds to the location URL which was returned when the mapping source was created.
      tags:
        - Mappings & Sources
      operationId: updateMappingSource
      parameters:
        - name: sourceId
          in: query
          required: true
          description: The ID of the mapping source
          schema:
            type: string
      requestBody:
        description: The source to update as a json object
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSystem"
            examples:
              SampleSourceJson:
                value:
                  {
                    "id": "/myapp/sources/mysource",
                    "displayName": "My Source",
                    "properties":
                      [
                        {
                          "key": "myprop1_ID",
                          "displayName": "Sample property1",
                        },
                      ],
                    "categories":
                      [
                        {
                          "key": "mycategory1_ID",
                          "displayName": "Sample category1",
                        },
                      ],
                  }
      responses:
        "200":
          description: OK
    delete:
      summary: Delete a mapping source
      description: |-
        You can delete a mapping source as a user with administration rights or as an app.
        The url corresponds to the location URL which was returned when the mapping source was created.
      tags:
        - Mappings & Sources
      operationId: deleteMappingSource
      parameters:
        - name: sourceId
          in: query
          required: true
          description: The ID of the mapping source
          schema:
            type: string
      responses:
        "200":
          description: OK

  /r/{repositoryId}/source:
    get:
      summary: Retrieving the default source system for a d.3 repository
      description: |-
        The default source system is a predefined source system for each d.3 repository
        which is provided by default by the DMS app. When you provide an extension to DMS
        functions and do not want to define your own source system, you can use the properties
        and categories of the d.3 repository with the default source system.

        The definition of a default source system and the associated mappings are set by the
        DMS app. You cannot change mappings for a default source system.
      tags:
        - Mappings & Sources
      operationId: getMappingSourceDefault
      parameters:
        - $ref: "#/components/parameters/repositoryId"
      responses:
        "200":
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/DefaultSourceSystem"
              examples:
                DefaultSourceSystem:
                  value:
                    {
                      "id": "/r/dee1f3d3-eae8-5d9d-84d8-2d758c5ddc27/source",
                      "displayName": "D3RepositoryName",
                      "properties":
                        [
                          {
                            "key": "1ac35664-e204-4bee-8aee-378abbae78ae",
                            "type": "String",
                            "displayName": "Sample property1",
                          },
                        ],
                      "categories":
                        [
                          {
                            "key": "d42018fc-ab90-4ca5-807c-5259152fd3ab",
                            "displayName": "Sample category1",
                          },
                        ],
                    }

  /r/{repositoryId}/m:
    post:
      summary: Storing mapping
      description: |-
        Send an HTTP POST request with the mapping for your source system as the Body for the URL that you received in the mappingconfig link relation.
        If the mapping is stored successfully, you receive the HTTP status code 201 Created.
      tags:
        - Mappings & Sources
      operationId: storeMapping
      parameters:
        - $ref: "#/components/parameters/repositoryId"
      requestBody:
        content:
          application/hal+json:
            schema:
              $ref: "#/components/schemas/MappingContainer"
            examples:
              MappingContainer:
                value:
                  {
                    name: "My Source",
                    sourceId: "/myapp/sources/mysource",
                    mappingItems:
                      [
                        {
                          destination: "RECH",
                          source: "mycategory1_ID",
                          type: 1,
                        },
                        { destination: "3", source: "myprop1_ID", type: 0 },
                        {
                          destination: "property_caption",
                          source: "myprop2_ID",
                          type: 0,
                        },
                        {
                          destination: "property_state",
                          source: "custom_value",
                          sourceCustomValue: "Release",
                          type: 0,
                        },
                      ],
                  }

      responses:
        "201":
          description: OK
    get:
      summary: Retrieving stored mappings
      description: |-
        To retrieve the mapping, execute an HTTP GET request for the URL /dms/r/{repositoryID}/m?sourceId={sourceID}.
        The value of the sourceID property indicates the unique identifier of the source (for example, /myapp/sources/mysource).
      tags:
        - Mappings & Sources
      operationId: getMappings
      parameters:
        - $ref: "#/components/parameters/repositoryId"
        - name: sourceId
          in: query
          required: true
          description: The ID of the source system
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/hal+json:
              schema:
                type: object
                properties:
                  mappings:
                    type: array
                    items:
                      $ref: "#/components/schemas/MappingContainer"
              examples:
                MappingContainerList:
                  value:
                    {
                      "mappings":
                        [
                          {
